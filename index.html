<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金馬奇幻影展 2026 片單規劃</title>
<style>
:root{
  --bg:#0f0f1a;
  --surface:#1a1a2e;
  --surface2:#242440;
  --border:#2e2e50;
  --text:#f0e6d0;
  --text2:#9090b8;
  --accent:#c8922c;
  --must:#e83c6c;
  --want:#e8862a;
  --tab-active:#c8922c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh;font-size:15px;}
.page{display:none;height:100vh;overflow:hidden;flex-direction:column;}
.page.active{display:flex;}

/* Header */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header h1{font-size:18px;font-weight:700;color:var(--accent);}
.header-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.back-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;}
.back-btn:hover{border-color:var(--accent);}

/* Home */
.home-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:20px;}
.home-logo{font-size:56px;text-align:center;}
.home-title{font-size:22px;font-weight:700;text-align:center;color:var(--accent);line-height:1.4;}
.home-subtitle{font-size:13px;color:var(--text2);text-align:center;}
.name-section{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;}
.name-section label{font-size:13px;color:var(--text2);}
.name-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-size:16px;width:100%;outline:none;}
.name-input:focus{border-color:var(--accent);}
.name-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.name-chip{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;}
.name-chip:hover{border-color:var(--accent);color:var(--text);}
.participants-info{font-size:12px;color:var(--text2);text-align:center;}
.participants-info strong{color:var(--text);}
.btn{display:block;width:100%;max-width:360px;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;text-align:center;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text);}
.btn:hover{opacity:.88;}
.config-notice{background:rgba(232,60,108,.12);border:1px solid rgba(232,60,108,.4);border-radius:10px;padding:14px 16px;font-size:13px;color:#e06080;max-width:360px;width:100%;}

/* Tabs */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:90;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:10px 14px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn.active{color:var(--tab-active);border-bottom-color:var(--tab-active);}

/* Category filter chips */
.cat-chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:80;scrollbar-width:none;}
.cat-chips::-webkit-scrollbar{display:none;}
.cat-chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.cat-chip.active{color:#fff;border-color:transparent;}

/* Film grid */
.films-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  grid-auto-rows: max-content; /* 關鍵：確保每一列都保持卡片原始高度，不被壓縮 */
  align-content: start;
  gap: 12px;
  padding: 14px;
  overflow-y: auto;
  flex: 1;
  min-height: 0; /* 關鍵：解除 Flexbox 的預設限制，讓 overflow-y: auto 能正常運作 */
}

.film-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, border-color .15s;
  position: relative;
  display: flex;          /* 新增：內部改為 Flex 佈局 */
  flex-direction: column; /* 新增：直向排列 */
  height: 100%;           /* 新增：撐滿外層網格賦予的高度 */
}
.film-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.film-card.has-must{border-color:var(--must);}
.film-card.has-want{border-color:var(--want);}
.film-poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--surface2);}
.film-poster-placeholder{width:100%;aspect-ratio:2/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:36px;}
.film-card-body{padding:8px;height:80px;overflow:hidden;}
/* 限制卡片標題最多顯示兩行，超過自動變成 ... */
.film-card-title {
  font-size: 12px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2; /* 限制最多兩行 */
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 限制電影資訊（導演、國家、片長）只能顯示單行，超過自動變成 ... */
.film-card-meta {
  font-size: 10px;
  color: var(--text2);
  margin-top: 3px;
  white-space: nowrap; /* 強制不換行 */
  overflow: hidden; /* 隱藏超出的部分 */
  text-overflow: ellipsis; /* 超出部分顯示 ... */
}
.film-card-cats{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.cat-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;color:#fff;}
.film-card-pref{position:absolute;top:6px;right:6px;font-size:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0);}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 0;}
.modal-close{background:var(--surface2);border:none;color:var(--text2);font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-body{padding:0 16px 20px;}
.modal-poster{width:100%;max-height:240px;object-fit:cover;border-radius:8px;margin-bottom:12px;}
.modal-title-zh{font-size:20px;font-weight:700;color:var(--text);line-height:1.3;}
.modal-title-en{font-size:13px;color:var(--text2);margin-top:2px;}
.modal-info{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.info-chip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--text2);}
.info-chip strong{color:var(--text);}
.modal-special{margin-top:8px;font-size:11px;color:var(--accent);font-weight:600;}
.modal-synopsis{margin-top:12px;font-size:13px;line-height:1.7;color:var(--text2);}
.modal-synopsis-toggle{color:var(--accent);cursor:pointer;font-size:12px;margin-top:4px;display:inline-block;}
.modal-section-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;border-top:1px solid var(--border);padding-top:12px;}
.screening-row{display:flex;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;gap:8px;background:var(--surface2);}
.screening-row.sel-must{border-color:var(--must);background:rgba(232,60,108,.1);}
.screening-row.sel-want{border-color:var(--want);background:rgba(232,134,42,.1);}
.scr-date{font-size:11px;color:var(--text2);white-space:nowrap;min-width:60px;}
.scr-time{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;}
.scr-venue{flex:1;font-size:11px;color:var(--text2);line-height:1.3;}
.scr-badges{display:flex;flex-direction:column;gap:2px;align-items:flex-end;min-width:20px;}
.scr-badge{font-size:9px;font-weight:700;color:#fff;padding:1px 5px;border-radius:3px;white-space:nowrap;}
.scr-badge.director{background:#7C3AED;}
.scr-badge.nosub{background:#6B7280;}
.scr-actions{display:flex;gap:4px;flex-shrink:0;}
.pref-btn{padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.pref-btn.must-active{background:var(--must);border-color:var(--must);color:#fff;}
.pref-btn.want-active{background:var(--want);border-color:var(--want);color:#fff;}

/* Schedule page */
.schedule-content{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.schedule-day-panel{display:none;flex:1;overflow:hidden;flex-direction:column;}
.schedule-day-panel.active{display:flex;}

/* 修正子分頁標籤列，允許水平滑動並隱藏捲軸 */
.sub-tabs {
  display: flex;
  flex-shrink: 0;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  gap: 2px;
  overflow-x: auto;         /* 新增：允許橫向滾動 */
  scrollbar-width: none;    /* 新增：隱藏 Firefox 捲軸 */
}
.sub-tabs::-webkit-scrollbar {
  display: none;            /* 新增：隱藏 Chrome/Safari 捲軸 */
}

/* 確保按鈕文字不折行，且不會被擠壓 */
.sub-tab-btn {
  padding: 8px 16px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  white-space: nowrap;      /* 新增：強制文字不換行 */
  flex-shrink: 0;           /* 新增：確保按鈕寬度不被壓縮 */
}
.sub-tab-btn.active{color:var(--text);border-bottom-color:var(--text);}
.sub-panel{display:none;flex:1;overflow:auto;}
.sub-panel.active{display:block;}
.person-tabs{position:sticky;top:0;z-index:15;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);scrollbar-width:none;}
.person-tabs::-webkit-scrollbar{display:none;}
.person-tab-btn{padding:4px 14px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;border-radius:20px;white-space:nowrap;transition:all .15s;flex-shrink:0;}
.person-tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.person-flow-panel{display:none;}
.person-flow-panel.active{display:block;}
.schedule-empty{text-align:center;color:var(--text2);padding:60px 20px;font-size:14px;}
.schedule-header-info{padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.persons-list{display:flex;flex-wrap:wrap;gap:4px;margin-left:6px;}
.person-pill{padding:1px 8px;border-radius:10px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);}

/* Timeline */
.tl-scroll{overflow:auto;flex:1;}
.tl-wrap{display:inline-block;min-width:100%;}
.tl-header-row{display:flex;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--border);}
.tl-time-th{flex-shrink:0;width:44px;background:var(--bg);}
.tl-col-header{flex-shrink:0;width:110px;padding:5px 4px;font-size:9px;font-weight:700;color:#fff;text-align:center;line-height:1.3;border-left:1px solid rgba(255,255,255,.1);}
.tl-body{position:relative;}
.tl-gridline{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.06);pointer-events:none;}
.tl-gridline.hour{background:rgba(255,255,255,.12);}
.tl-time-label{position:absolute;left:0;width:42px;font-size:9px;color:var(--text2);text-align:right;padding-right:4px;transform:translateY(-50%);pointer-events:none;}
.tl-block{position:absolute;cursor:pointer;border-radius:4px;overflow:hidden;border:none;transition:filter .1s;user-select:none;-webkit-user-select:none;}
.tl-block:active{filter:brightness(1.3);}
.tl-block.tl-must{box-shadow:0 0 8px rgba(232,60,108,.5);z-index:5;}
.tl-block.tl-want{z-index:4;}
.tl-block.tl-want::after{content:'';position:absolute;inset:0;background:rgba(15,15,26,.55);pointer-events:none;z-index:6;}
.tl-block.tl-want .tl-block-inner{position:relative;z-index:7;}
.tl-block-inner{width:100%;height:100%;padding:3px 4px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;}
.tl-block-name{font-size:9px;font-weight:700;color:rgba(255,255,255,.95);line-height:1.25;word-break:break-all;}
.tl-block-sub{font-size:8px;color:rgba(255,255,255,.7);margin-top:1px;line-height:1.2;}
.tl-badge{display:inline-block;font-size:8px;font-weight:800;color:#fff;border-radius:2px;padding:1px 3px;margin-top:2px;align-self:flex-start;}
.tl-badge.must{background:var(--must);}
.tl-badge.want{background:var(--want);}
.tl-block-persons{display:flex;flex-wrap:wrap;gap:1px;margin-top:2px;}
.tl-person-dot{font-size:7px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);border-radius:2px;padding:1px 2px;line-height:1.3;}
.ptl-conflict-bar,.ptl-earlyleave-bar{position:absolute;top:0;left:0;right:0;height:5px;z-index:9;}
.ptl-conflict-bar{background:repeating-linear-gradient(90deg,#ff2200 0,#ff2200 6px,#ffcc00 6px,#ffcc00 12px);}
.ptl-earlyleave-bar{background:repeating-linear-gradient(90deg,#ff8800 0,#ff8800 6px,#ffe066 6px,#ffe066 12px);}

/* Film detail modal click from timeline */
.tl-legend{display:flex;align-items:center;gap:12px;padding:6px 10px;font-size:10px;color:var(--text2);background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.tl-legend span{display:flex;align-items:center;gap:3px;}
.tl-legend-swatch{display:inline-block;width:10px;height:10px;border-radius:2px;}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:9999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Responsive */
@media(min-width:600px){
  .films-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
  .home-content, .modal {
    max-width: 600px;
    margin: 0 auto; /* 新增：讓首頁內容與彈跳視窗在大螢幕時水平置中 */
  }
}
</style>
</head>
<body>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
  <div class="header">
    <div>
      <h1>🎬 金馬奇幻影展 2026</h1>
      <div class="header-sub">片單規劃 · 好友共同選片</div>
    </div>
  </div>
  <div class="home-content">
    <div class="home-logo">🐎🎥</div>
    <div class="home-title">2026 金馬奇幻影展<br>好友片單規劃</div>
    <div class="home-subtitle">選你想看的電影、知道和朋友什麼時候撞場</div>

    <div id="firebase-notice" class="config-notice" style="display:none;">
      ⚠️ 請先設定 Firebase：找到 FIREBASE_CONFIG 並填入你的專案設定。
    </div>

    <div class="name-section">
      <label>你的名字</label>
      <input id="name-input" class="name-input" type="text" placeholder="輸入名字..." maxlength="20" autocomplete="off">
      <div id="name-chips" class="name-chips"></div>
      <div id="participants-info" class="participants-info">載入中...</div>
    </div>

    <button class="btn btn-primary" onclick="goToSelect()">🎬 選我想看的片</button>
    <button class="btn btn-secondary" onclick="goToSchedule()">📅 看大家的時程</button>
  </div>
</div>

<!-- SELECT PAGE -->
<div id="page-select" class="page">
  <div class="header">
    <div>
      <h1>🎬 選片</h1>
      <div class="header-sub" id="select-subtitle">選擇你想看的電影</div>
    </div>
    <button class="back-btn" onclick="goHome()">← 返回</button>
  </div>
  <div class="cat-chips" id="cat-chips"></div>
  <div class="films-grid" id="films-grid"></div>
</div>

<!-- SCHEDULE PAGE -->
<div id="page-schedule" class="page">
  <div class="header">
    <div>
      <h1>📅 合併時程表</h1>
      <div class="header-sub"><span id="live-dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#44dd88;animation:blink 1.5s infinite;margin-right:4px;"></span>即時同步</div>
    </div>
    <button class="back-btn" onclick="goHome()">← 返回</button>
  </div>
  <div class="tabs" id="schedule-tabs"></div>
  <div class="schedule-header-info">
    <span>已填寫：</span>
    <div id="schedule-persons" class="persons-list"></div>
  </div>
  <div class="schedule-content" id="schedule-content"></div>
</div>

<!-- FILM DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div style="font-size:11px;color:var(--text2);padding-top:4px;" id="modal-cats"></div>
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">

films/detail/4333","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_698e2df54aba010fea49b583cad8e1d6.jpeg","title_zh":"魅影巨星","title_en":"Mother Mary","director_zh":"大衛羅利","director_en":"David LOWERY","director_bio":"美國導演、編劇、製片，作品風格強烈、具有奇幻色彩。2013年《險路謎情》獲美國國家評論協會十大獨立製片與日舞影展評審團最佳攝影。2017年《鬼魅浮生》獲西班牙錫切斯影展最佳攝影和青少年評審團獎最佳劇情長片，2018年《老人與槍》讓勞勃瑞福入圍金球獎音樂喜劇類最佳男主角，其他作品尚有《尋龍傳說》、《綠騎士》等票房與口碑兼具。","country":"英國、芬蘭、德國、美國","year":"2026","duration":"110 分","rating":"6+","special_note":"","synopsis":"她是女神、是聖母、是電、是光、是舞臺上的神話。流行天后儘管擁有無數歌迷擁戴，舞台下卻被困囚在幻聽與失眠的陰影中。為了籌備全新演出而瀕臨崩潰的她，登門尋求疏遠已久的好友兼傳奇服裝設計師協助，試圖在高級訂製服的層層織網中，重新縫補自己破碎的靈魂。當兩人隱身於穀倉的工作室，過去的愛恨情仇、權力拉鋸與扭曲慾望，如同鬼魅，隨著針線與旋律穿透皮膚，化作名望與自我摧毀的心理戰爭。\n\n鬼才導演大衛羅利再度展現對時空與心理地景的精準掌控，以女神卡卡與泰勒絲為原型，深入流行音樂產業核心，讓超自然力量與肉體恐怖交織，直視當代偶像崇拜下，被神格化卻泣血的骨肉之軀。安海瑟薇最具張力演出，除了歌聲舞藝達到頂標，更詮釋出藝術工作者的魅惑與脆弱，與米凱拉柯爾激盪出令人窒息的火花。流行製作人 Jack Antonoff 與 Charli XCX 更是聯手打造出媲美華麗影像的音樂巨作。\n\n我一讀劇本就立刻意識到，不能只是去「表演」。如果拿到這個角色，我必須成爲導演創作的一部分。────安海瑟薇","screenings":[{"date":"2026-04-10","weekday":"五","time":"21:30","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4333_20260410_2130","venueId":"titan","endTime":"23:20"},{"date":"2026-04-18","weekday":"六","time":"11:40","venue":"台北信義威秀 15廳","director_attend":false,"no_en_subtitle":false,"id":"s4333_20260418_1140","venueId":"xinyi15","endTime":"13:30"}],"categories":["開幕片","聚焦：大衛羅利"],"poster_local":"posters/4333.jpeg"},{"id":"4334","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4334","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_7408143665acb0d362530268057dcefc.jpeg","title_zh":"魚人劫","title_en":"Mermaid","director_zh":"泰勒科納克","director_en":"Tyler CORNACK","director_bio":"美國編劇、導演、製片。早期於喜劇團體嶄露頭角，2019年的劇情長片《Butt Boy》於奧斯汀奇幻影展首映後備受讚譽，邪典電影教父約翰華特斯更將其列為他2020年最喜愛的電影。《魚人劫》為其最新作品，入選2025年SXSW影展。","country":"美國","year":"2025","duration":"105 分","rating":"15+","special_note":"2025 SXSW影展2025德國奇幻影展2025西班牙錫切斯奇幻影展","synopsis":"風光明媚的佛羅里達總是出奇人，離婚獨居的道格在脫衣舞俱樂部負責照顧大型水族箱，他深諳魚類習性卻不擅與人相處，就連女兒對他的熱絡也僅止於謝謝再聯絡。當俱樂部老闆狠心將道格開除，萬念俱灰的他準備在墨西哥灣了結餘生，卻意外遇到受傷的人魚。他以為這是老天給他的禮物，把人魚帶回家細心照料，誰想到一片真心竟換來致命危機⋯⋯ 。\n\n導演泰勒科納克發揮怪才本領，這部以家鄉為背景的新片，傾力顛覆童話對人魚的瑰麗幻想，沒有堅貞不渝的愛情信念，只有齜牙咧嘴的生存本能，看不破想不通的都是人類自己。當泡沫消失後，人心的貪婪與殘暴浮上海面，夢醒的道格，才發現更大的任務。這不僅是導演寫給家鄉的荒唐情書，也是對邊緣人心靈的深刻剖析。荒誕驚悚的程度，絕對兒童不宜。\n\n這不是《小美人魚》，愛麗兒沒事不會出現在魯蛇的故事裡！","screenings":[{"date":"2026-04-10","weekday":"五","time":"21:30","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4334_20260410_2130","venueId":"xinyi1315","endTime":"23:15"},{"date":"2026-04-11","weekday":"六","time":"12:30","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4334_20260411_1230","venueId":"xinyi1315","endTime":"14:15"},{"date":"2026-04-14","weekday":"二","time":"21:00","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4334_20260414_2100","venueId":"xinyi1315","endTime":"22:45"}],"categories":["罪悚快"],"poster_local":"posters/4334.jpeg"},{"id":"4335","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4335","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_548b86684298402d9356c8ac8c6d700a.jpeg","title_zh":"安李與她的烏托邦","title_en":"The Testament of Ann Lee","director_zh":"莫娜費斯沃德","director_en":"Mona FASTVOLD","director_bio":"1986年生於挪威，導演、編劇、製片與演員。首部執導長片《The Sleepwalker》即入選日舞影展正式競賽，續以《美好未來》入選威尼斯影展正式競賽。其編劇作品《逆光天后》、《邪惡的養成》皆入選威尼斯，《粗獷派建築師》更獲奧斯卡和英國金像獎最佳原創劇本提名，《安李與她的烏托邦》為其最新編導作品。","country":"英國","year":"2025","duration":"137 分","rating":"18+","special_note":"2026金球獎音樂喜劇類最佳女主角提名2026影評之選最佳女主角、電影歌曲提名2026美國獨立精神獎最佳剪輯2026柏林影展2025芝加哥影評人協會最佳導演、女主角、造型設計、原創電影配樂提名2025威尼斯影展正式競賽2025多倫多影展2025倫敦影展","synopsis":"1736 年的曼徹斯特，工人階級女子安李在貧窮、暴力與宗教狂熱交織的年代長大。在悲劇考驗層層磨練下，她不再把人生交給家庭與制度，而是把痛苦化為召喚：以顫抖、踏地、合唱與集體儀式，反抗肉身慾望，建立新的宗教秩序。信眾口中的「母親」逐漸成形，他們決定尋找一塊能自給自足、共享財產、重新定義愛與歸屬的土地。\n\n由莫娜費斯沃德執導，布萊迪寇貝特共同編劇，《粗獷派建築師》團隊再度帶來氣勢磅礴的史詩巨作。聲震驚天的「震教會」靈歌，如脈搏般推進情節；引人側目的舞蹈，則承載語言無法負荷的情感幅度，將祈禱推向感官的邊界，讓禁慾教義反被身體熱度照亮。宗教被形塑成「表演」，直指儀式如何召喚信仰；亞曼達塞佛瑞的演出更像一種「化身」，讓信念在眾人的同步呼吸裡成真。\n\n在那些光芒四射的巔峰時刻，費斯沃德 會讓我們所有人都短暫成為信徒。────〈綜藝〉雜誌","screenings":[{"date":"2026-04-12","weekday":"日","time":"10:50","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4335_20260412_1050","venueId":"titan","endTime":"13:07"},{"date":"2026-04-13","weekday":"一","time":"13:00","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4335_20260413_1300","venueId":"titan","endTime":"15:17"},{"date":"2026-04-15","weekday":"三","time":"21:10","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4335_20260415_2110","venueId":"titan","endTime":"23:27"}],"categories":["當代奇幻"],"poster_local":"posters/4335.jpeg"},{"id":"4336","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4336","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_fe6ba51646ddb15cec6dcf44746526cf.jpeg","title_zh":"奇異旅程：洛基恐怖秀","title_en":"Strange Journey: The Story of Rocky Horror","director_zh":"萊納斯歐布萊恩","director_en":"Linus O’BRIEN","director_bio":"英國紀錄片導演、製片，從事影像與音樂等跨領域創作，曾創辦洛杉磯地下電子音樂活動PANIC，《奇異旅程：洛基恐怖秀》為其首部紀錄長片。","country":"英國","year":"2025","duration":"90 分","rating":"6+","special_note":"2025 GAZE都柏林同志影展觀眾票選獎2025 SXSW影展2025西班牙錫切斯奇幻影展2025英國雪菲爾紀錄片影展2025里斯本紀錄片影展","synopsis":"當年小布阿珍汽車拋錨進錯城堡，開啟了影史上最邪門歪道的放映狂潮。片中的怪管家「老痞」──── 理查歐布萊恩，正是這場混亂的始作俑者。他不只是電影版的編劇與演員，更是元祖音樂劇的全能主創。半世紀後，其子萊納斯歐布萊恩拿起攝影機對準父親，重返這趟旅程起點：從倫敦小劇場起飛，首輪票房慘敗，最後卻在午夜場重生。看「法蘭克博士」提姆柯瑞一雙黑色網襪撐起全宇宙的性感、「阿珍」蘇珊莎蘭登一對純白胸罩解放全世界的慾望；讓觀眾從坐著觀影，到丟爆米花cosplay角色shout out互罵還不過癮。集結大量珍貴影像與全新訪談，見證在那個沒有社群網路的年代，《洛基恐怖秀》如何從邊緣文化出發，牢牢接住每個孤獨又狂野的靈魂，成為全球影迷膜拜的酷兒邪典。\n\n不管去過幾次「吹濕那裡癢」星球，還是在等狂歡場釋票繼續搶，本片都是最佳良伴，看片前後皆可服用，副作用是沒事就想來個時空跳躍，重返瘋狂！\n\n觀眾對我說：這已經不是「你的」電影，而是「我們」的。──── 理查歐布萊恩","screenings":[{"date":"2026-04-11","weekday":"六","time":"10:30","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4336_20260411_1030","venueId":"xinyi1315","endTime":"12:00"},{"date":"2026-04-13","weekday":"一","time":"19:00","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4336_20260413_1900","venueId":"xinyi1315","endTime":"20:30"},{"date":"2026-04-16","weekday":"四","time":"19:30","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4336_20260416_1930","venueId":"xinyi1315","endTime":"21:00"}],"categories":["金馬大舞廳"],"poster_local":"posters/4336.jpeg"},{"id":"4337","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4337","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_05e336873c9716bdefcb93f6036c6c7a.jpeg","title_zh":"未來曾來過","title_en":"Colours of Time","director_zh":"賽德利克柯拉皮許","director_en":"Cédric KLAPISCH","director_bio":"1961年生於巴黎，早期擔任片廠電工，之後拍攝短片並獲國際影展肯定，並成立製作公司。1992年首部長片《Little Nothings》即擅於從日常生活中捕捉當代各種情感面向，最廣為人知的作品是《西班牙公寓》三部曲，電影作品尚有《巴黎愛情故事》、《巴黎寂寞不打烊》，亦參與人氣劇集《找我經紀人》第一季製作與導演工作。","country":"法國、比利時","year":"2025","duration":"126 分","rating":"0+","special_note":"2025法國凱薩獎最佳新進女演員、藝術指導、服裝設計提名2025坎城影展2025慕尼黑影展2025美國棕櫚泉影展2025瑞典哥特堡影展","synopsis":"一棟諾曼第鄉間的廢棄老宅，牽起了幾個陌生人的緣分。看似毫無交集的他們竟然是遠房親戚，也是這座宅邸的繼承代表。他們齊聚在塵埃覆蓋的老屋，牆上掛著泛黃的照片和不知名的畫作。電影在這兩個時空穿梭，竟有了奇妙的交會。照片中的女孩在十九世紀末踏上旅程前往巴黎，尋找未曾謀面的母親，藉此解開身世之謎。而這趟冒險，也將帶給一百多年後的子孫們意想不到的驚喜。\n\n曾參與執導《找我經紀人》的柯拉皮許首度挑戰跨時代敘事，網羅多位出身演藝世家的新生代演員同台飆戲，以雙時間軸交錯鋪陳，循著印象派畫作的光與影，用藝術交織血緣，一步步拼湊出屬於「她」的故事。讓1895年的巴黎與2025年的當代視角彼此映照、互為折射，充滿巧思，引人入勝。隨著影像捕捉的那時此刻，一筆一畫為時間上色，一瞬一格回望過去，也迎向未來。\n\n「我剛被維多雨果搭訕了！」","screenings":[{"date":"2026-04-11","weekday":"六","time":"21:00","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4337_20260411_2100","venueId":"xinyi12","endTime":"23:06"},{"date":"2026-04-15","weekday":"三","time":"11:30","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4337_20260415_1130","venueId":"xinyi12","endTime":"13:36"},{"date":"2026-04-18","weekday":"六","time":"15:00","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4337_20260418_1500","venueId":"xinyi12","endTime":"17:06"}],"categories":["當代奇幻"],"poster_local":"posters/4337.jpeg" ynopsis":"「Mayday  Mayday，緊急呼救，我們要離開地球！」1984年那個雷電交加的夜晚，一道亮光穿透雲層，三個小孩陳子健、何家謙、林可兒在華富邨目擊UFO低空飛過，從此成為都市傳說。隨著三人成長，各奔東西，他們的人生軌跡亦伴著香港八○年代的蓬勃希望，九七回歸的集體浮躁，最終被捲入千禧時代的蒼白洪流裡。而當他們再度聚首，不禁疑問：當年在天台上追逐的神祕光芒，到底是什麼？\n\n本片改編1980年代香港最著名的都市傳說之一，曾於2019年香港亞洲電影節首映，之後就未曝光，亦成為電影圈的都市傳說。如今終於重現，甫登場就拿下香港電影評論學會大獎並入圍十項金像獎。導演梁栢堅用鏡頭濃縮近二十年的時代變遷，細膩包裹港人對身分認同的焦慮與感嘆。「Twins」阿Sa蔡卓妍與「Shine」黃又南、徐天佑睽違多年銀幕再聚，衛詩雅、梁雍婷、朱栢康、白只、盧海鵬等一票演技派同台參演，為這部傳奇之作更添光芒。\n\n「只要你願意幻想，幻想就可以帶來希望。」","screenings":[{"date":"2026-04-11","weekday":"六","time":"13:00","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4339_20260411_1300","venueId":"titan","endTime":"15:02"}],"categories":["特別放映"],"poster_local":"posters/4339.jpeg"},{"id":"4340","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4340","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_4128cc0282489af54c06170efb29e077.jpeg","title_zh":"小姐好白","title_en":"White Chicks","director_zh":"基能韋恩","director_en":"Keenen Ivory WAYANS","director_bio":"1958年生於美國，身兼導演、演員、編劇、製片、主持，以尖銳的諷刺風格奠定其影視地位。他開創的傳奇諷刺喜劇節目《In Living Color》，不僅捧紅傑米福克斯、金凱瑞，也提攜多位韋恩家族成員；爾後與弟弟馬龍、西恩攜手合作的《驚聲尖笑》、《小姐好白》更成為賣座電影，是當代非裔喜劇的核心推手。","country":"美國","year":"2004","duration":"115 分","rating":"6+","special_note":"2004非裔娛樂電視喜劇大獎票房電影最佳導演、編劇2004年度臭到爆爛片獎最痛苦難笑喜劇","synopsis":"黑人警探凱文和馬可斯，急於立功卻總是搞砸差事，連護送豪門千金的證人保護行動，都可以衰到翻車。為了保住飯碗，他們竟異想天開，男扮女裝，喬裝成白人姐妹花，潛入名媛社交圈，展開祕密臥底。他們能否突破死對頭刁難、閨密圈的考驗和追求者的重重關卡，達成任務呢？\n\n基能韋恩率領弟弟馬龍與西恩聯手編演，大膽從比利懷德的影史經典《熱情如火》汲取靈感。但他們不只瘋玩性別轉換，直戳名媛文化的虛榮假掰，更尖酸嘲諷了種族刻板印象與階級落差，就連對嘴歌曲都彈無虛發，一曲〈A Thousand Miles〉躍成另類經典，更從當年被責為爛片的評價成功翻身。金馬奇幻影展首度挑戰狂歡，帶領觀眾重溫各種笑到噴飯的橋段，跟著泰瑞克魯斯抖肩甩頭、引吭高歌，還要一起瘋狂尬舞，美翻影廳！\n\n三倍重擊，T、K、A。老娘準備大開殺戒！","screenings":[{"date":"2026-04-18","weekday":"六","time":"16:10","venue":"MUVIE TITAN( 趴踢場 )","director_attend":false,"no_en_subtitle":false,"id":"s4340_20260418_1610","venueId":"titan_p","endTime":"18:05"},{"date":"2026-04-18","weekday":"六","time":"19:00","venue":"MUVIE TITAN( 趴踢場 )","director_attend":false,"no_en_subtitle":false,"id":"s4340_20260418_1900","venueId":"titan_p","endTime":"20:55"}],"categories":["金馬大舞廳"],"poster_local":"posters/4340.jpeg"},{"id":"4341","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4341","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_71c72a6095eb3c518fd6fd6cd271f440.jpeg","title_zh":"縫線頭歷險記","title_en":"Stitch Head","director_zh":"史蒂夫哈德森","director_en":"Steve HUDSON","director_bio":"1969年生於英國倫敦，現定居德國，導演、編劇、演員。就讀劍橋大學期間開始投入寫作、表演與導演創作，曾跨多國從事劇場工作。2004年以短片《Goodbye》入選威尼斯影展並提名歐洲電影獎。2006年首部劇情長片《True North》入選多倫多影展。","country":"德國、盧森堡","year":"2025","duration":"91 分","rating":"0+","special_note":"2025美國土星獎最佳國際動畫提名2025盧森堡電影獎最佳合製動畫2025安錫動畫影展2025漢堡影展2025蘇黎世影展","synopsis":"在傳說中的恐怖堡裡，瘋狂教授埋頭創造各種萌萌怪，卻總是「造後不理」。身為怪物1號的縫縫頭只好當起苦命長男，教導怪物弟妹要溫良恭儉讓，免得引來山下暴民放火燒堡。某天，渴求噱頭的怪胎馬戲團登門挖角，承諾給予他前所未有的肯定與掌聲。一心渴望愛的視線的縫縫頭決心冒險出道，但懼怕怪物的人類，真的會接納奇怪的他嗎？\n\n史蒂夫哈德森首部動畫長片，改編自英國作家蓋伊巴斯的同名小說。充滿設計細節的怪物造型，明豔精緻的故事場景，搭配繽紛瘋狂的馬戲歌舞，非常適合闔家觀賞。然而對影迷而言，它同時巧妙拼接多部經典，就像《科學怪人》遇上《怪獸電力公司》，一同攜手在《大娛樂家》的世界探險。表面光明浪漫，但從對峙與和解，看出人類更像怪物的諷刺；並從漠視與陪伴，重新檢視家庭的定義。那張縫縫補補的小臉，其實寄藏了很多疑問。\n\n我很怪，但是我很溫柔。","screenings":[{"date":"2026-04-11","weekday":"六","time":"10:30","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4341_20260411_1030","venueId":"xinyi12","endTime":"12:01"},{"date":"2026-04-15","weekday":"三","time":"14:10","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4341_20260415_1410","venueId":"xinyi12","endTime":"15:41"},{"date":"2026-04-19","weekday":"日","time":"15:20","venue":"台北信義威秀 13廳","director_attend":false,"no_en_subtitle":false,"id":"s4341_20260419_1520","venueId":"xinyi13","endTime":"16:51"}],"categories":["當代奇幻"],"poster_local":"posters/4341.jpeg"},{"id":"4342","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4342","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_7f0f76cf197ddefaee139ca7f80637bc.jpeg","title_zh":"UFO離奇命案","title_en":"Unidentified Murder","director_zh":"郭家禧","director_en":"KWOK Ka-hei","director_bio":"香港導演、編劇及監製，曾執導多部TVB電視台劇集，後以個人身分執導《大叔的愛》（香港版）、《百萬同居計劃》、《老是常出現》等劇集。2025年與李振傑共同編導之首部長片《UFO離奇命案》獲香港電影評論學會最佳編劇及推薦電影，並入圍香港金像獎最佳編劇、新晉導演。","country":"香港","year":"2025","duration":"86 分","rating":"0+","special_note":"2026香港金像獎最佳編劇、新晉導演、男配角提名2026香港電影評論學會大獎最佳編劇2025香港亞洲電影節","synopsis":"25年前，小學生豪仔在東頭山離奇消失，同行友人聲稱他被外星人抓走，成為轟動一時的新聞。25年後，外星人話題持續延燒，各方人馬為了不同原因，重回事發現場。沒想到設定的腳本逐步變調，現場爆發命案，勒索短訊隨後而來，就連外星人都下凡「共襄盛舉」，整起事件完全失控，大夥還需自圓其說！\n\n以三百萬港幣製作、四個場景完成拍攝，《UFO離奇命案》在有限的條件下，玩出令人驚喜的敘事結構，懸疑、驚悚與荒誕笑料兼備。劇情一路翻轉，戲中有戲，節奏明快，情節緊湊，精采直逼《一屍到底》。既重現久違的港式黑色幽默，也諷刺流量年代的集體瘋狂，瘋癲、過癮，一舉奪下香港電影評論學會大獎最佳編劇。\n\n透過戲中戲中戲中戲中戲中戲的結構和都市傳說，把低成本製作轉化成創意爆發的舞台。────香港亞洲電影節","screenings":[{"date":"2026-04-12","weekday":"日","time":"10:50","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4342_20260412_1050","venueId":"xinyi1315","endTime":"12:16"},{"date":"2026-04-13","weekday":"一","time":"21:00","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4342_20260413_2100","venueId":"xinyi1315","endTime":"22:26"},{"date":"2026-04-15","weekday":"三","time":"19:10","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4342_20260415_1910","venueId":"xinyi1315","endTime":"20:36"}],"categories":["特別放映"],"poster_local":"posters/4342.jpeg"},{"id":"4343","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4343","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_6edee8df5ca24f86d62b0d8d754b0ca1.jpeg","title_zh":"羅莎大逃殺","title_en":"Heads or Tails?","director_zh":"阿萊西奧里戈德里吉","director_en":"Alessio RIGO de RIGHI","director_bio":"1989年生，義裔美籍導演、編劇與製片，自2013年起與馬泰奧佐皮斯合作，作品涵蓋紀錄片與劇情片，多次入選國際影展。兩人首部合導的劇情長片《The Tale of King Crab》於坎城影展首映，並獲義大利大衛獎最佳新導演提名。代表作品尚包括《Belva nera》、《Il solengo》。《羅莎大逃殺》為最新作品，並獲東京影展最佳導演。","country":"義大利、美國","year":"2025","duration":"116 分","rating":"15+","special_note":"2025東京影展最佳導演2025維勒魯普義大利影展評審團獎2025坎城影展一種注目2025盧卡諾影展2025瑞典哥特堡影展","synopsis":"二十世紀初，名聞遐邇的水牛比爾（Buffalo Bill）帶著私人記錄員與當紅的「狂野西部秀」巡迴到義大利，一場美義牛仔馴馬大賽成為全城焦點。代表義大利的桑提諾刻意忽視地主的「放水」指令贏得比賽，地主的年輕妻子羅莎欣賞這個男人的叛逆，在意外變做寡婦後，兩人成為亡命鴛鴦，賞金獵人則一路追來。目睹男人們的貪婪與大話，羅莎決心奪回敘事主導權，把自己的故事拿回來。\n\n靈感取自「水牛比爾」巡迴義大利的真實事件，雙人導演組再出奇招，拍出調性歪斜、自成一格的歐洲西部片。亡命牛仔、持槍寡婦與說書人，齊聚北義荒原。風格與結構致敬西部傳統，骨子裡卻拆解類型與經典。《罪美人》娜迪雅特列什科維奇的犀利演出閃耀奪目，與《切膚之痛》亞歷山德羅伯爾吉攜手上演末日之戀。故事配上歌謠，再添幾筆超現實元素，破解常規，故事遂有了全新面貌。\n\n荒野大亂鬥，義大利醬汁大爆發！──── 〈綜藝〉雜誌","screenings":[{"date":"2026-04-14","weekday":"二","time":"14:40","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4343_20260414_1440","venueId":"xinyi12","endTime":"16:36"},{"date":"2026-04-16","weekday":"四","time":"21:00","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4343_20260416_2100","venueId":"xinyi12","endTime":"22:56"},{"date":"2026-04-19","weekday":"日","time":"12:40","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4343_20260419_1240","venueId":"xinyi12","endTime":"14:36"}],"categories":["當代奇幻"],"poster_local":"posters/4343.jpeg"},{"id":"4344","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4344","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_97316299872cf0a1215565a684d544f1.jpeg","title_zh":"欠妳的那場婚禮：第1-2集","title_en":"Dog Man: Ep.1-2","director_zh":"嚴藝文","director_en":"YEN Yi-wen","director_bio":"作品橫跨電視、電影及劇場，身兼演員、導演、編劇與主持等多重身分。2024年影集《影后》入選金馬創投企劃、CATCHPLAY注目劇集獎，同年於釜山影展全球首映，繼《俗女養成記》後再度橫掃金鐘多項提名，並榮獲戲劇節目導演獎。《欠妳的那場婚禮》為其編導之最新影集作品。","country":"台灣","year":"2026","duration":"90 分","rating":"0+","special_note":"","synopsis":"曾是人生勝利組的樂團主唱周可傑，年輕時什麼都不缺，才華洋溢、一張帥臉；中年後卻江郎才盡，連倒個垃圾都藉口一堆，婚姻關係降至冰點。受不了廢柴老公的陳立璇，禁不住回憶起當年，自己究竟是如何暈船才會迷上這張臉。生活觸礁、感情告急，就在人生的十字路口，陳立璇竟看見25歲的周可傑，穿越滂沱大雨迎面走來⋯⋯？\n\n金鐘獎最佳導演嚴藝文繼《影后》再度出擊，從女演員的辛酸血淚跨到男子樂團的落魄中年，邀來張孝全顛覆形象、魯蛇演出，與蘇慧倫從女神化身人妻搭作怨偶；痞帥朱軒洋為戲飆唱，搭檔新生代女星蒲禾菲，細膩詮釋迂迴曖昧的青春愛戀；老班底謝盈萱、黃迪揚、姚淳耀攜手王渝萱、裴子齊，共同打造全新愛情輕喜劇。一場跨越時空的忘年對話，能夠拯救回不去了的怨偶，以及廢物中年的自己嗎？\n\n人生走下坡沒關係，至少青春還會帶你走上坡！","screenings":[{"date":"2026-04-12","weekday":"日","time":"16:10","venue":"MUVIE TITAN","director_attend":true,"no_en_subtitle":false,"id":"s4344_20260412_1610","venueId":"titan","endTime":"17:40"},{"date":"2026-04-14","weekday":"二","time":"19:00","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4344_20260414_1900","venueId":"xinyi1315","endTime":"20:30"}],"categories":["特別放映"],"poster_local":"posters/4344.jpeg"},{"id":"4345","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4345","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_eb16a68ece6bf7a190e18a68cdbf8dc2.jpeg","title_zh":"鑽死鑽死亮晶晶","title_en":"Reflection in a Dead Diamond","director_zh":"海蓮娜卡特","director_en":"Hélène CATTET","director_bio":"布魯諾佛扎尼從短片時期就開始與海蓮娜卡特搭檔，共同創作的短片在各大奇幻影展獲獎無數，2009年《安娜的迷宮》是他們執導的首部劇情長片，《鑽死鑽死亮晶晶》是兩人合作的第四部長片作品。","country":"比利時、盧森堡、義大利、法國","year":"2025","duration":"87 分","rating":"15+","special_note":"2025柏林影展正式競賽2025西班牙錫切斯奇幻影展2025翠貝卡影展2025瑞士紐沙特奇幻影展2025加拿大奇幻影展2025倫敦影展","synopsis":"年逾七旬的前特務D，隱居在蔚藍海岸的豪華飯店，監視海灘上的遊客，留意隔壁房間的神祕女子，成了他僅存的嗜好。某日女子離奇失蹤，塵封的記憶悄然被喚醒，難道當年的死對頭「蛇蠍女」又捲土重來，對他展開最後的報復？然而記憶破碎迷離，宛如電影場面，D究竟真是傳奇特務，還是入戲太深的電影幽魂？\n\n優雅老翁凝望海灘的開場，讓人誤以為是直男版《魂斷威尼斯》。然而隨著槍戰床戰輪番上演，很難不想到《007》影響下的歐洲間諜片。加上穿腦戒指、殺人禮服、割喉美甲、絕子絕孫高跟鞋，以及變化萬千的人皮面具，把義大利黑色漫畫與鉛黃電影超級發揚光大。導演自承還有《千年女優》、《日落大道》的影響，成就了這部拆解IP、拼貼類型，環環相扣，讓影迷為之振奮的力作。極致的感官饗宴，也被視為海蓮娜卡特、布魯諾佛扎尼這對導演組合集大成之作。\n\n繫好安全帶，抓緊扶手，盡情享受這部充滿創意、獨一無二的電影。────The Daily Beast","screenings":[{"date":"2026-04-10","weekday":"五","time":"17:00","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4345_20260410_1700","venueId":"xinyi12","endTime":"18:27"},{"date":"2026-04-12","weekday":"日","time":"10:30","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4345_20260412_1030","venueId":"xinyi12","endTime":"11:57"},{"date":"2026-04-18","weekday":"六","time":"13:00","venue":"台北信義威秀 13廳","director_attend":false,"no_en_subtitle":false,"id":"s4345_20260418_1300","venueId":"xinyi13","endTime":"14:27"}],"categories":["當代奇幻"],"poster_local":"posters/4345.jpeg"},{"id":"4346","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4346","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_dc62fdef220a1fa6e1f01c56b01fa429.jpeg","title_zh":"整個世界，只有你連上了我：第1-4集","title_en":"Connecting to You: Ep.1-4","director_zh":"游智涵","director_en":"YU Jhi-han","director_bio":"台灣編劇、導演、剪輯，2008年《百獄》曾獲金穗獎最佳學生影片、導演獎，2018年短片《癡情馬殺雞》入選舊金山、洛杉磯等同志影展，2023年執導首部劇情長片《壞男孩》獲選為高雄電影節閉幕片。《整個世界，只有你連上了我》為其首部劇集作品，並入選金馬創投會議。","country":"台灣","year":"2026","duration":"93 分","rating":"0+","special_note":"","synopsis":"佳凱身為學校通靈社台柱，天生看得見人與人之間的「連線」：代表愛情的紅線、親情的綠線、甚至充滿敵意的藍線。然而他自己卻是什麼線都沒有的「無線店」和「絕緣體」。直到有一天，不信邪的員警大緯出現在他眼前，兩人之間竟然有條前所未見的「銀線」。儘管碰到他都沒好事，佳凱還是想搞清楚這條線到底是什麼意思，就這樣和大緯「纏」在一起！\n\n改編自作家Beck高人氣BL小說〈無線人生〉，導演游智涵以校園輕喜劇結合超現實偵查風格，並由新生代演員《夜校女生》邱以太與《進行曲》劉育仁生動演繹「通靈少年」與「鐵齒警察」，把迷信和邏輯送作堆，用靈異與推理撞出新滋味。每集二十分鐘的緊湊篇幅，全新CP曖昧升溫。如果「愛的連線」還不夠，那就只好「抱警處理」了！\n\n所有的不對盤，都是為了撞出那條閃爍銀光的命中注定。","screenings":[{"date":"2026-04-11","weekday":"六","time":"15:00","venue":"台北信義威秀 12廳","director_attend":true,"no_en_subtitle":false,"id":"s4346_20260411_1500","venueId":"xinyi12","endTime":"16:33"}],"categories":["特別放映"],"poster_local":"posters/4346.jpeg"},{"id":"4347","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4347","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_cfc5527ffb33327137886d7ca0d42be4.jpeg","title_zh":"謎航","title_en":"Rose of Nevada","director_zh":"馬克詹金","director_en":"Mark JENKIN","director_bio":"1976年生於英國，身兼導演、製片、編劇、剪輯、攝影、音效設計。2019年自編自導劇情長片《Bait》於柏林影展首映後備受矚目，並獲英國金像獎最佳首作；2022年《詭島謎花》於坎城影展導演雙週首映。《謎航》為其最新長片作品，入選威尼斯、多倫多影展。","country":"英國","year":"2025","duration":"115 分","rating":"6+","special_note":"2025視與聽雜誌年度五十大影片2025威尼斯影展地平線2025多倫多影展2025紐約影展2025倫敦影展","synopsis":"三十年前，「內華達玫瑰號」被宣告海上失蹤，如今突然出現在港口──無人駕駛，且完好無損。沒落的漁村無視種種不尋常跡象，仍然招募船員再次出海。兩名年輕男子各因不同理由，加入這場新的捕魚遠征。當漁船滿載回航，步上岸邊的兩人，發現小鎮透露出古怪氣氛，他們被歡迎，卻像換了一個身分。大海彷彿自有意志，將他們捲進時間的漩渦，就看你是否要配合演出？\n\n以 16毫米底片拍攝，粗礪影像質地，為這部奇幻電影建構出極度寫實的視覺，反而更顯得離奇詭異。身兼編導，同時包辦剪輯、攝影、配樂與聲音設計的馬克詹金，以獨一無二的方式，凝望被長期忽視的英格蘭海岸角落與勞工階級。《1917》喬治麥凱與《換乘真愛》卡倫透納內斂迷人的演繹，在詹金大膽、稜鏡般的敘事中，逐步陷入時間、記憶與社群幽影的糾纏。《謎航》高度風格化的電影語言，堪稱英國獨立製片年度驚喜之作。\n\n失蹤漁船離奇重現，為蕭條漁村帶來的是曙光，還是詛咒？","screenings":[{"date":"2026-04-12","weekday":"日","time":"15:10","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4347_20260412_1510","venueId":"xinyi12","endTime":"17:05"},{"date":"2026-04-14","weekday":"二","time":"21:10","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4347_20260414_2110","venueId":"xinyi12","endTime":"23:05"},{"date":"2026-04-17","weekday":"五","time":"17:30","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4347_20260417_1730","venueId":"xinyi12","endTime":"19:25"}],"categories":["當代奇幻"],"poster_local":"posters/4347.jpeg"},{"id":"4348","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4348","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_da78ab836e8605f063e065b720f64820.jpeg","title_zh":"多重宇宙綁架事件","title_en":"Bulk","director_zh":"班偉特利","director_en":"Ben WHEATLEY","director_bio":"1972年生，創作橫跨電影、劇集、MV、廣告，為英國獨立電影鬼才導演。首作《不良之家》一鳴驚人，獲英國獨立電影獎雨舞獎，以迷幻懸疑驚悚風格著稱，作品尚有《無限殺人意料之外》、《觀光客出沒，注意！》、《英倫夢田》、《摩天樓》、《玩命鎗火》、《地靈人劫》、《巨齒鯊2：海溝深淵》等。","country":"英國","year":"2025","duration":"90 分","rating":"15+","special_note":"2025愛丁堡影展2025奧斯汀奇幻影展2025西班牙錫切斯奇幻影展2025阿姆斯特丹奇幻影展2025史特拉斯堡奇幻影展","synopsis":"男子醒來發現自己被綁架到陌生房子，但綁匪要的不是贖金，而是要他去營救困在某個平行時空的科學家們。原來科學家實驗失敗，導致「腦波對撞機」爆炸，屋子成為多重宇宙的入口，每扇門都通往不同的奇異世界。在謎樣女子的引領之下，他半推半就踏上冒險旅程。影片的敘事結構不斷被解構，就如同男主角難以預料的命運一般。\n\n鬼才導演班偉特利在《巨齒鯊2：海溝深淵》後回歸最拿手的獨立電影，再次帶來「不管嗑了什麼，都給我來一點」的驚奇。帶著傳統英式驚悚片主角魅力登場的山姆萊利，帶領觀眾闖進這個混亂而荒誕的世界。亞歷珊卓瑪莉雅羅納冷靜地掌控這場瘋狂直到最後一刻，形成鮮明對比。加上手繪動畫、拼貼技法、實景特效，恣意揮灑。Ｂ級類型趣味與燒腦實驗風格兼具，再摻入幽默諷刺和古怪瘋狂，爆炸的不只是腦波對撞機，還有觀眾的身心靈！套句角色說的：不要大聲質疑故事，那只會破壞它。而且只有九十分鐘，再長就嫌多了！\n\n所有參與本片的人應該都和導演一樣，在惡作劇與玩樂的氣氛下，樂在其中。────​〈綜藝〉雜誌","screenings":[{"date":"2026-04-10","weekday":"五","time":"15:00","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4348_20260410_1500","venueId":"xinyi12","endTime":"16:30"},{"date":"2026-04-11","weekday":"六","time":"14:50","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4348_20260411_1450","venueId":"xinyi1315","endTime":"16:20"},{"date":"2026-04-15","weekday":"三","time":"21:10","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4348_20260415_2110","venueId":"xinyi1315","endTime":"22:40"}],"categories":["當代奇幻"],"poster_local":"posters/4348.jpeg"},{"id":"4349","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4349","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_8392b707fa788f51584c1a3b364033a3.jpeg","title_zh":"羅密歐與茱麗葉","title_en":"Romeo + Juliet","director_zh":"巴茲魯曼","director_en":"Baz LUHRMANN","director_bio":"1962年生於澳洲，1992年首作《舞國英雄》即入選坎城影展一種注目單元，1996年現代版《羅密歐與茱麗葉》將李奧納多狄卡皮歐推上柏林影帝寶座，亦在英國金像獎獲得最佳導演與改編劇本兩項大獎，除了《紅磨坊》，著名作品尚有《大亨小傳》、《貓王艾維斯》等。","country":"美國、墨西哥、澳洲、加拿大","year":"1996","duration":"120 分","rating":"6+","special_note":"1998英國金像獎最佳導演、改編劇本、電影音樂、藝術指導1998倫敦影評人協會最佳女演員1997柏林影展最佳男演員1997百事達娛樂獎最受歡迎男、女演員1997奧斯卡金像獎最佳藝術指導提名","synopsis":"由於法蘭哥柴菲萊利扣人心弦的《殉情記》（1968）珠玉在前，巴茲魯曼另闢蹊徑，將莎翁筆下的背景移植至現代，並找來盛世美顏的李奧納多狄卡皮歐與克萊兒丹妮絲，重新演繹這對命運乖舛的青春戀人。\n\n當莎士比亞十六世紀的古典台詞，遇上了九○年代風格的黑幫火拼，會衝撞出怎樣的火花？巴茲魯曼果然交出了最狂放的演繹。不僅注入擅長的絢爛美學與流行音樂元素，更大膽將鬥劍改為槍戰、將劇院旁白轉化為電視新聞。在充滿霓虹、刺青與宗教符碼與花襯衫的時空裡，重塑了這段傳頌數百年的純愛輓歌。\n\n適逢本片上映三十週年，當年若錯過那場魚缸兩側凝視彼此的驚鴻定情，請務必把握機會，在永恆情歌〈Kissing You〉的旋律中，重溫大銀幕經典的心動瞬間。\n\n巴茲魯曼創造了一種專屬於九○年代的「視覺毒品」。他成功證明了：莎士比亞不需要被保護在博物館裡，他應該屬於街頭。──── 〈滾石〉雜誌","screenings":[{"date":"2026-04-12","weekday":"日","time":"17:40","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4349_20260412_1740","venueId":"xinyi12","endTime":"19:40"},{"date":"2026-04-13","weekday":"一","time":"10:30","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4349_20260413_1030","venueId":"titan","endTime":"12:30"},{"date":"2026-04-16","weekday":"四","time":"21:30","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4349_20260416_2130","venueId":"titan","endTime":"23:30"}],"categories":["影迷許願池"],"poster_local":"posters/4349.jpeg"},{"id":"4350","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4350","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_42eee3147c9d9a8b14a42d23bf45223b.jpeg","title_zh":"Good Luck, Have Fun, Don't Die","title_en":"Good Luck, Have Fun, Don't Die","director_zh":"高爾沃賓斯基","director_en":"Gore VERBINSKI","director_bio":"1964年生於美國，導演、編劇與製片，以音樂錄影帶與廣告起家，1997年以《捕鼠氣》展開導演生涯。作品橫跨恐怖、冒險與動畫，2002年翻拍日本恐怖經典《七夜怪談西洋篇》，2003年開始執導全球賣座《神鬼奇航》系列，2011年動畫《飆風雷哥》獲奧斯卡最佳動畫長片。近年回歸獨立製作，持續以大膽敘事與類型混搭探索電影形式，作品尚有《獨行俠》、《白日夢冒險王》。","country":"northfivesixDaniel.Feldman@northfivesix.com","year":"2025","duration":"134 分","rating":"15+","special_note":"2026柏林影展2026美國棕櫚泉影展2025奧斯汀奇幻影展","synopsis":"一名手持炸彈引爆器、貌似流浪漢的男子，闖入洛杉磯美式餐廳。他聲稱自己來自未來，這已經是第117次回到同一個夜晚，因為未來世界快被AI搞死了，他得在時間耗盡前，號召勇士並肩作戰。問題是這支「人類最後希望」小隊看來實在頗沒搞頭：遇到3C產品就流鼻血的臭臉打工女、抖音一響學生不鳥的教師情侶檔、神情恍惚心事重重的神祕女子、莽撞的運將大哥，還有只是路過點個派的清潔阿姨。唯一共同點，是他們的生活都被科技搞得天翻地覆。末日拼裝軍團糊裡糊塗勉強上路，也只能說聲：「祝好運、好好玩、別GG！」\n\n《神鬼奇航》導演高爾沃賓斯基回歸獨立製作，以極具風格的構圖、精準俐落的動作設計與令人血脈賁張的末日美學，揉合當代社會對大數據演算、AI科技發展的依賴與焦慮，發展成一部彷彿《黑鏡》加上《今天暫時停止》、《魔鬼終結者》槓上《媽的多重宇宙》的黑色科幻動作冒險喜劇。怪咖影帝山姆洛克威爾以反英雄魅力掌控全局，率領一眾魯蛇烏合之眾殺出血路，原創屌打所有IP與續集作品。當「低頭族」碰上世界末日？記得拍照上傳按讚分享訂閱開啟小鈴噹！\n\n有人說這部片很瘋，但瘋狂有時候可以減輕焦慮。────高爾沃賓斯基","screenings":[{"date":"2026-04-14","weekday":"二","time":"18:40","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4350_20260414_1840","venueId":"titan","endTime":"20:54"},{"date":"2026-04-16","weekday":"四","time":"10:30","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4350_20260416_1030","venueId":"titan","endTime":"12:44"},{"date":"2026-04-17","weekday":"五","time":"21:20","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4350_20260417_2120","venueId":"titan","endTime":"23:34"}],"categories":["當代奇幻"],"poster_local":"posters/4350.jpeg"},{"id":"4351", 0","venueId":"titan","endTime":"17:31"}],"categories":["喜劇萬花筒"],"poster_local":"posters/4354.jpeg"},{"id":"4355","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4355","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_dc7bcc017838784abfba1162039bf967.jpeg","title_zh":"John錯就錯","title_en":"The Last Viking","director_zh":"安德斯湯瑪士詹森","director_en":"Anders Thomas JENSEN","director_bio":"1972年生於丹麥，編劇、導演，以黑色喜劇風格見長。編劇作品有與名導蘇珊娜畢爾合作的《婚禮之後》、《更好的世界》等。執導之短片《瘋狂選舉夜》曾獲奧斯卡最佳短片，長片有《雞密真相》、《正義老司機》等，《John錯就錯》為其最新作品。","country":"丹麥","year":"2025","duration":"111 分","rating":"15+","special_note":"2026丹麥羅伯獎最佳劇情片、導演等十四項提名2026丹麥波迪獎最佳整體演出提名2026歐洲電影獎最佳男演員提名2025阿姆斯特丹奇幻影展最佳劇情片2025塞維亞歐洲影展最佳影片2025威尼斯影展2025多倫多影展","synopsis":"「丹麥一哥」邁茲米克森再次挑戰演技難度，飾演患有解離性身分障礙的男子，自認是傳奇音樂人約翰藍儂。從小相依為命的哥哥，入獄前把鉅款交給他藏了起來，出獄後卻一問三不知。為了讓他找回丟失的記憶和自我，找出鉅款下落，只能聽從精神醫師建議，從醫院劫出另外兩個病患，重組「披頭四」，還必須從練團開始⋯⋯。\n\n六度合作導演安德斯湯瑪士詹森，邁茲米克森攜手另一位影帝尼古拉斯雷卡斯共譜患難兄弟情。一本正經的台詞與表情，卻把笑點榨到極致，披頭四轉身變阿巴合唱團，一言不合就跳樓跳車，荒腔走板到近乎瘋狂。骨子裡卻以海盜維京人的無畏精神，包裹家庭、友誼、身分認同等多重主題。當我們瘋在一起，世界才會變得正常。結合暗黑暴力美學，合奏出一首對受傷靈魂充滿包容的人生變奏曲。\n\n「如果人人都有缺陷，就等於大家都沒缺陷。」","screenings":[{"date":"2026-04-10","weekday":"五","time":"14:00","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4355_20260410_1400","venueId":"titan","endTime":"15:51"},{"date":"2026-04-14","weekday":"二","time":"21:30","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4355_20260414_2130","venueId":"titan","endTime":"23:21"},{"date":"2026-04-18","weekday":"六","time":"17:00","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4355_20260418_1700","venueId":"xinyi1315","endTime":"18:51"}],"categories":["喜劇萬花筒"],"poster_local":"posters/4355.jpeg"},{"id":"4356","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4356","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_efadd2fd414f04d99f153017d65a4d4d.jpeg","title_zh":"捉神弄鬼","title_en":"Death Becomes Her","director_zh":"羅勃辛密克斯","director_en":"Robert ZEMECKIS","director_bio":"1952年生於美國，導演、監製、編劇，創作風格橫跨恐怖、科幻、黑色喜劇。1985年執導《回到未來》系列而成名，真人結合動畫的電影《威探闖通關》亦獲得成功，1994年憑藉《阿甘正傳》獲得奧斯卡最佳導演。作品尚有《浩劫重生》、《北極特快車》、《走鋼索的人》、《女巫們》等。","country":"美國","year":"1992","duration":"104 分","rating":"6+","special_note":"1993奧斯卡金像獎最佳視覺效果1993英國金像獎最佳視覺效果1993美國土星獎最佳女配角、特效1993金球獎音樂喜劇類最佳女主角提名","synopsis":"當年，女明星搶了女作家的未婚夫，令閨密反目成仇。愛情友情雙失的作家，更因此暴飲暴食，失控走樣。沒想到十多年後，肥婆變身美魔女再度登場，成為暢銷作家。昔日女星卻已過氣，美貌不再。不肯認輸的她，意外獲得女巫的不老藥水，再度叫戰。她們都想青春永駐，卻把自己活成妖怪。落跑男人有什麼好留戀？女人戰爭卻一發不可收拾。\n\n喜劇是歌蒂韓的本行，得心應手；文藝片女神梅莉史翠普較《女人心海底針》更變本加厲的瘋狂演繹，本片儘管獲得金球獎提名，卻反應兩極。隨著時間它的評價愈來愈高，原來梅姨已在為《穿著Prada的惡魔》打好底。羅勃辛密克斯在《阿甘正傳》前的大鳴大放，把你以為的貶低，變成是先見之明，各種身體的變形，完全具象了什麼是「扭曲」和「空洞」。布魯斯威利甩開硬漢形象演出窩囊整形醫生，氣質女星伊莎貝拉羅賽里尼的美麗撩人，以及《遠離非洲》金獎導演薛尼波拉克的畫龍點睛，亦讓人津津樂道。\n\n當你為了留住皮囊而放棄人性，永恆的生命只不過是一場無止境的修補馬戲團。","screenings":[{"date":"2026-04-11","weekday":"六","time":"10:40","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4356_20260411_1040","venueId":"titan","endTime":"12:24"},{"date":"2026-04-17","weekday":"五","time":"11:00","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4356_20260417_1100","venueId":"xinyi12","endTime":"12:44"},{"date":"2026-04-18","weekday":"六","time":"12:40","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4356_20260418_1240","venueId":"xinyi12","endTime":"14:24"}],"categories":["影迷許願池"],"poster_local":"posters/4356.jpeg"},{"id":"4357","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4357","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_9bda7a7bce24f7d7cfbb1ead80411bc0.jpeg","title_zh":"分身髮術","title_en":"The Better Me","director_zh":"尼可拉夏萊","director_en":"Nicolas CHARLET","director_bio":"1970年生於法國，導演、編劇、剪輯。作品橫跨音樂MV、劇集、電影，擅長於現實與荒誕邊緣遊走。與布魯諾拉凡為長期合作搭檔，以以「Nicolas & Bruno」之名闖蕩國際，共同編導作品有《Me Two》、《The Big Bad Wolf》、《In Search Of The Ultra-Sex》等，《分身髮術》為兩人最新合導作品。","country":"法國","year":"2026","duration":"100 分","rating":"6+","special_note":"2026法國l'Alpe d'Huez喜劇影展","synopsis":"以失守的髮際線力展中年危機的艾力克，生活過得平淡無奇，直到撞見隔壁搬來的新鄰居，竟然是「完美版自己」？更加荒謬的是，如此顯而易見的事實卻成了只有自己察覺、說不出口的祕密。面對眼前這位魅力爆棚、生活情趣滿點，連名字都只差一個字的完美分身艾克索，一切如鏡像般卻又令人嫉妒的存在，讓他逐漸陷入偏執的泥淖。這名神祕分身的出現，究竟是他平庸人生的救贖，還是自我崩解的開端？\n\n法國荒誕喜劇拍檔尼可拉和布魯諾執導，邀來方才憑藉《女富豪的美麗與哀愁》奪下法國凱薩獎影帝的羅倫拉菲帝，以精湛演技一人分飾二角，加上法國最具人氣的冷面喜劇女王布蘭琪蓋汀、「龐德女郎」歐嘉柯瑞蘭蔻連袂出演，不僅將故事推至荒謬高潮，驚狂結局更是出人意表。\n\n這世界上真有可能遇見另一個自己？","screenings":[{"date":"2026-04-10","weekday":"五","time":"21:10","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4357_20260410_2110","venueId":"xinyi12","endTime":"22:50"},{"date":"2026-04-17","weekday":"五","time":"15:20","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4357_20260417_1520","venueId":"xinyi12","endTime":"17:00"},{"date":"2026-04-18","weekday":"六","time":"17:40","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4357_20260418_1740","venueId":"xinyi12","endTime":"19:20"}],"categories":["喜劇萬花筒"],"poster_local":"posters/4357.jpeg"},{"id":"4358","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4358","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_58d5d18435f2e959495b1195f448b2e2.jpeg","title_zh":"閩江船事件","title_en":"Isolation","director_zh":"游智傑","director_en":"YU Chih-chieh","director_bio":"畢業於臺灣藝術大學電影學系，擅長混合懸疑類型和偽紀錄片美學。2022年憑短片《神明在看》獲得金穗獎最佳學生劇情片，2024年再以畢業作品《四牲六道》獲金穗獎評審團特別獎。最新短片作品《末代殭屍》於鹿特丹影展首映；現正開發改編其短片《閩江船事件》的同名電影長片企劃。","country":"台灣","year":"2025","duration":"18 分","rating":"15+","special_note":"2025瑞士紐沙特奇幻影展","synopsis":"1990年代台海危機，一艘可疑漁船擱淺台灣偏遠離島前哨，國軍哨點隨之失聯，究竟是敵軍所為還是另有蹊蹺？軍令秩序在活屍突襲下瞬間瓦解，年輕的前線士兵們陷入前所未有的危機。兩度獲金穗獎肯定的導演游智傑首度結合活屍類型和軍事題材，並集結潘親御、大鶴林鶴軒與陳泰河等年輕阿兵哥對抗活屍蔓延。當敵人來臨，保家衛國將不再是口號，而是一場窒息式的生存遊戲。\n\n「要不要留營啊？國軍需要的就是你這種人才啦！」","screenings":[{"date":"2026-04-11","weekday":"六","time":"17:30","venue":"台北信義威秀 12廳","director_attend":true,"no_en_subtitle":false,"id":"s4358_20260411_1730","venueId":"xinyi12","endTime":"17:48"},{"date":"2026-04-12","weekday":"日","time" 生存下去？並撒上一點純愛與親情當作調味。\n\n一言不合就疊羅漢！","screenings":[{"date":"2026-04-11","weekday":"六","time":"16:50","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":true,"id":"s4361_20260411_1650","venueId":"xinyi1315","endTime":"18:12"},{"date":"2026-04-15","weekday":"三","time":"18:50","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":true,"id":"s4361_20260415_1850","venueId":"xinyi12","endTime":"20:12"}],"categories":["東瀛狂想"],"poster_local":"posters/4361.jpeg"},{"id":"4362","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4362","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_ee19e93f12d1c71320a0166af62bcc3f.jpeg","title_zh":"綠騎士","title_en":"The Green Knight","director_zh":"大衛羅利","director_en":"David LOWERY","director_bio":"美國導演、編劇、製片，作品風格強烈、具有奇幻色彩。2013年《險路謎情》獲美國國家評論協會十大獨立製片與日舞影展評審團最佳攝影。2017年《鬼魅浮生》獲西班牙錫切斯影展最佳攝影和青少年評審團獎最佳劇情長片，2018年《老人與槍》讓勞勃瑞福入圍金球獎音樂喜劇類最佳男主角，其他作品尚有《尋龍傳說》、《綠騎士》等票房與口碑兼具。","country":"美國","year":"2021","duration":"130 分","rating":"12+","special_note":"2022影評之選超級獎科幻／奇幻類最佳男演員2022 雨果獎最佳戲劇呈現長篇類提名2022 美國土星獎最佳奇幻電影提名2021 美國國家評論協會年度十大獨立電影2021 美國高譚獎最佳影片、劇本提名","synopsis":"放蕩的高文成天在妓院縱酒作樂，他的母親是女巫，國王則是他的舅舅，他們對高文寄予厚望，盼他成為真正的騎士。節慶之際，咒語顯靈，高大駭人的綠騎士現身，對現場提出挑戰：願接受任何人一擊，但一年後要原封不動奉還。為了不負期盼，高文上前應戰，一劍砍下綠騎士的頭顱。一年後，兌現時間到了，高文踏上旅程接受試煉⋯⋯。\n\n取材自亞瑟王傳說詩篇〈高文爵士與綠騎士〉，大衛羅利自由吸納不列顛與愛爾蘭民間故事元素，讓幽靈、魔法與幻覺滲入旅程。空間氛圍飽滿、造型層次細膩，講究的美術與服裝織就出工藝華美的中世紀質地。濕透沼澤、薄霧森林、蜿蜒山路之間，攝影捕捉愛爾蘭大地的寒意，映照主角心中啃噬不去的恐懼。戴夫帕托英氣勃勃，細膩詮釋出人性的怯懦、慾望，以及對榮耀的執念。在一段段動人的幻景之中，成為餘韻深長的慢燃寓言。\n\n大膽且不落窠臼的作品，充滿迷人的曖昧與未竟之意。──── 〈好萊塢報導〉","screenings":[{"date":"2026-04-17","weekday":"五","time":"11:50","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4362_20260417_1150","venueId":"titan","endTime":"14:00"},{"date":"2026-04-19","weekday":"日","time":"12:40","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4362_20260419_1240","venueId":"titan","endTime":"14:50"}],"categories":["聚焦：大衛羅利"],"poster_local":"posters/4362.jpeg"},{"id":"4363","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4363","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_ae65ec7efd3a5d00c5a96db3f1c98b8f.jpeg","title_zh":"星與月是天上的洞","title_en":"The Stars and Moon are Holes in the Sky","director_zh":"荒井晴彥","director_en":"ARAI Haruhiko","director_bio":"1947年生於日本，資深編劇、導演，參與多部粉紅電影製作。1977年以《新宿亂街：前去等待》編劇正式出道，後以《大鹿村騷動記》、《W的悲劇》等作品獲電影旬報最佳劇本，亦多次獲日本電影金像獎最佳編劇提名。導演代表作包括《火口的二人》、《花腐》等，《星與月是天上的洞》為其最新作品。","country":"日本","year":"2025","duration":"122 分","rating":"18+","special_note":"2026香港電影節2026 日本秋田十文字影展2026 日本高崎影展","synopsis":"1969年春天。失婚多年的小說家矢添，在黑白的昭和日常裡過著近乎透明的生活。除了吃飯與寫作，他只與妓女維持近乎供需交換的肉體往來。直到遇見率直的女大生紀子，曖昧迅速滋長。當身體的親密糾纏逐漸演變為心理攻防，矢添被迫直視自己對情感連結的恐懼，以及那個令他難以啟齒的祕密。\n\n《火口的二人》導演荒井晴彦改編芥川賞得主吉行淳之介同名小說。延續一貫成人情慾書寫，慾望不再獸性，反以旁白、停頓與曖昧對話建構核心張力；刻意維持純男性視角，暴露羞恥的本質，也彰顯對陽剛自尊與性幻想的反諷，將主角一步步推向自我幻滅的文學式剖析。綾野剛內斂詮釋其枯槁與狼狽，新銳女星咲耶則以收放自如的演出，替二人之間的角力注入關鍵的誘惑與層次。還有田中麗奈、柄本佑跨刀演出。\n\n你的靈魂有破洞渴望填補嗎？","screenings":[{"date":"2026-04-11","weekday":"六","time":"12:30","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":true,"id":"s4363_20260411_1230","venueId":"xinyi12","endTime":"14:32"},{"date":"2026-04-17","weekday":"五","time":"20:50","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":true,"id":"s4363_20260417_2050","venueId":"xinyi1315","endTime":"22:52"}],"categories":["東瀛狂想"],"poster_local":"posters/4363.jpeg"},{"id":"4364","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4364","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_50f96af30414f8c59bc4f1bede5fabd8.jpeg","title_zh":"腦精急轉彎","title_en":"Madly","director_zh":"保羅傑諾維西","director_en":"Paolo GENOVESE","director_bio":"1966年生於羅馬，導演、編劇。廣告起家，曾執導多支獲獎廣告，後跨足電影，2016年以《完美陌生人》於義大利口碑及票房雙贏，不僅榮獲大衛獎最佳影片、劇本，更被翻拍為多國版本。作品尚有《麥田書香》、《願望咖啡館》、《真愛超能力》、《如果可以再死一次》等。","country":"義大利","year":"2025","duration":"97 分","rating":"6+","special_note":"2025義大利記者協會銀緞帶獎最佳喜劇片、喜劇女主角2025卡羅維瓦利影展","synopsis":"她剛結束一段感情，他是離婚的高中老師。他受邀來到她的公寓，兩個人第一次正式約會，表面上都是經驗豐富的情場老將，仍免不了心頭小鹿亂撞。要主動一點，還是不要太急躁？想保留一些，卻擔心氣氛冷掉。只見各種思緒化為具體人型，忙著替主角下指導棋，當本能想要上床，理智卻贊成走掉，各種兒童不宜的情理交戰，讓心有戚戚的有情人也笑彎了腰。\n\n創下全球翻拍最高紀錄的《完美陌生人》導演保羅傑諾維西，這次將擅長的密室多角攻防，變成毫無冷場的高概念喜劇。透過男女首次約會，把緊張、浪漫、猜疑、衝動具象為實體角色，讓鏡頭在現實與腦內世界靈活切換，平凡的「初次約會」變成一場成人版加真人版的《腦筋急轉彎》。義大利影壇一線卡司全員出動，化身各色人格較勁飆戲，精準呈現成年男女在渴望親密與害怕受傷之間的瘋狂拉扯，果然再創票房佳績。\n\n義大利真／成人版《腦筋急轉彎》，百分百兒童不宜！","screenings":[{"date":"2026-04-10","weekday":"五","time":"19:20","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4364_20260410_1920","venueId":"xinyi1315","endTime":"20:57"},{"date":"2026-04-11","weekday":"六","time":"18:40","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4364_20260411_1840","venueId":"xinyi1315","endTime":"20:17"},{"date":"2026-04-18","weekday":"六","time":"21:50","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4364_20260418_2150","venueId":"xinyi1315","endTime":"23:27"}],"categories":["非一般愛情"],"poster_local":"posters/4364.jpeg"},{"id":"4365","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4365","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_f580fbc83feef9f5f6f0dcb9a414f637.jpeg","title_zh":"鬼魅浮生","title_en":"A Ghost Story","director_zh":"大衛羅利","director_en":"David LOWERY","director_bio":"美國導演、編劇、製片，作品風格強烈、具有奇幻色彩。2013年《險路謎情》獲美國國家評論協會十大獨立製片與日舞影展評審團最佳攝影。2017年《鬼魅浮生》獲西班牙錫切斯影展最佳攝影和青少年評審團獎最佳劇情長片，2018年《老人與槍》讓勞勃瑞福入圍金球獎音樂喜劇類最佳男主角，其他作品尚有《尋龍傳說》、《綠騎士》等票房與口碑兼具。","country":"美國","year":"2017","duration":"93 分","rating":"15+","special_note":"2017美國國家評論協會年度十大獨立電影2017波士頓影評人協會年度十大影片2017加拿大奇幻影展AQCC大獎2017西班牙錫切斯奇幻影展最佳攝影、青少年評審團獎最佳劇情長片2017日舞影展","synopsis":"一場突如其來的意外，讓男子與心愛的妻子天人永隔。但他從未離去，化身為披著白色床單的鬼魂重返舊居，在沉默中陪伴著妻子。他看著她在絕望中哭泣、自閉，如生活在真空中。當妻子決定搬離，這抹孤魂仍執拗地留守原地，支撐他度過無盡歲月的，是妻子離去前藏在牆縫深處的一張字條。隨著住戶更迭、屋舍拆除化為廢墟，孤魂在無聲的遊蕩中，刻畫生死之間最難跨越的距離。\n\n導演大衛羅利摒棄繁複劇情，以看似驚悚的題材，將紮實的情感昇華為極簡的人生體悟。全片採用1.33圓角畫幅，營造如老照片般的幽閉美學。凱西艾佛列克與魯妮瑪拉攜手演繹，將心死的孤寂化作漫長的告別。尤其凱西艾佛列克，即便全片幾乎隱於床單下，仍以肢體散發穿透銀幕的寂寥。\n\n「我在等人。等誰？我不記得了。」","screenings":[{"date":"2026-04-15","weekday":"三","time":"17:00","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4365_20260415_1700","venueId":"titan","endTime":"18:33"},{"date":"2026-04-17","weekday":"五","time":"19:10","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4365_20260417_1910","venueId":"titan","endTime":"20:43"},{"date":"2026-04-19","weekday":"日","time":"10:30","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4365_20260419_1030","venueId":"titan","endTime":"12:03"}],"categories":["聚焦：大衛羅利"],"poster_local":"posters/4365.jpeg"},{"id":"4366","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4366","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_de38a6902fb9c5f2cedc97093ceb9250.jpeg","title_zh":"超越無限電影院","title_en":"You are the Film","director_zh":"上田誠","director_en":"UEDA Makoto","director_bio":"1979年生於日本京都，為Europe Kikaku劇團代表，曾獲第61屆岸田國士戲曲賞，也參與電視劇及電影編劇。曾替《春宵苦短，少女前進吧！》、《四疊半時光機藍調》、《企鵝公路》改編動畫劇本，以及擔任電影《前田建設奇幻營業部》、《超越無限兩分鐘》、《無限泡湯兩分鐘》及《初戀33次》編劇。《超越無限電影院》為其首部執導長片。","country":"Adam Toreladam@thirdwindowfilms.com","year":"2026","duration":"68 分","rating":"6+","special_note":"2026布魯塞爾奇幻影展","synopsis":"陷入創作地獄的舞台劇作家，打算暫離現況去隔壁看個電影喘口氣，當她走進空無一人的影廳，銀幕上的場景怎麼這麼熟悉？畫面中那個因為演唱會票房不佳而與團員吵架的團長，怎麼也坐在一模一樣的影廳內不發一語？觀眾跟角色像是大眼瞪小眼，「這到底是什麼爛片」才剛說出口，銀幕上的他竟回應了⋯⋯？\n\n繼「無限兩分鐘」系列電影佳評如潮，編劇上田誠這回初執導筒，再度聯手京都知名劇團Europe Kikaku和東京獨立戲院Tollywood強勢回歸。全片未使用任何特效，莫比烏斯環般看似簡單卻益發複雜的敘事，把看與被看、創作者與觀眾巧妙揉入多重宇宙，弭平邊界。讓你腦洞大開，跟隨劇情天翻地覆，讚嘆電影竟然還能這樣拍！\n\n既是一部青春電影，也是電影的青春。我們是電影，你也是電影。請一邊觀看電影，一邊被電影觀看。────上田誠","screenings":[{"date":"2026-04-11","weekday":"六","time":"15:40","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4366_20260411_1540","venueId":"titan","endTime":"16:48"},{"date":"2026-04-12","weekday":"日","time":"22:10","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4366_20260412_2210","venueId":"xinyi1315","endTime":"23:18"},{"date":"2026-04-15","weekday":"三","time":"15:10","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4366_20260415_1510","venueId":"titan","endTime":"16:18"},{"date":"2026-04-16","weekday":"四","time":"21:30","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":false,"id":"s4366_20260416_2130","venueId":"xinyi1315","endTime":"22:38"}],"categories":["東瀛狂想"],"poster_local":"posters/4366.jpeg"},{"id":"4367","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4367","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_de0582d0384f6e47e1498da65a11a31e.jpeg","title_zh":"你是不會當樹嗎","title_en":"Silent Friend","director_zh":"伊爾蒂蔻恩伊達","director_en":"Ildikó ENYEDI","director_bio":"1955年生於布達佩斯。匈牙利導演、編劇與製片，以超現實風格著稱，早期從事當代藝術活動。1989年首部劇情長片《我的二十世紀》獲坎城影展金攝影機獎，1999年以《Simon, the Magician》於盧卡諾影展獲獎，2017年《夢鹿情謎》獲柏林影展金熊獎最佳影片、影評人費比西獎，2025年《你是不會當樹嗎》入選威尼斯影展正式競賽，並獲影評人費比西獎。","country":"德國、法國、匈牙利","year":"2025","duration":"147 分","rating":"0+","special_note":"2025威尼斯影展最佳新演員、影評人費比西獎2025芝加哥影展最佳攝影2025里斯本影展評審團獎榮譽提及2025多倫多影展2025釜山影展2025倫敦影展","synopsis":"德國某大學，一棵矗立在此好幾世紀的銀杏樹，靜靜地陪伴世間風景變換。1908年，第一個招收的女學生，在男性主宰的世界裡以攝影發掘了植物的奧祕。1972年．沉默的男孩與一株天竺葵之間，牽起了難以言說的連結。2020年，前來講學的香港神經學家為疫情所困，對銀杏樹展開奇想實驗。三組人物、三個篇章，跨越了時間與空間，在樹下織起了神祕且美麗的交會。\n\n從《夢鹿情謎》對動物的關照，到本片向植物的凝視，匈牙利名導伊爾蒂蔻恩伊達持續探索人類與自然物種的本質與交集。梁朝偉渾然天成，飾演陷入孤獨寂境的科學家，在蕾雅瑟杜的幫助下，探索植物的無限可能。三段故事分別以35毫米黑白底片、16毫米彩色膠卷與數位影像呈現，呼應了歷史的軌跡、世事的更迭，更溫柔而詩意地映照了人與植物之間的情感與命運交疊。\n\n成為一棵樹是什麼感覺？ ──── 伊爾蒂寇恩伊達","screenings":[{"date":"2026-04-13","weekday":"一","time":"20:40","venue":"MUVIE TITAN","director_attend":true,"no_en_subtitle":false,"id":"s4367_20260413_2040","venueId":"titan","endTime":"23:07"},{"date":"2026-04-18","weekday":"六","time":"14:00","venue":"台北信義威秀 15廳","director_attend":false,"no_en_subtitle":false,"id":"s4367_20260418_1400","venueId":"xinyi15","endTime":"16:27"}],"categories":["聚焦：伊爾蒂蔻恩伊達"],"poster_local":"posters/4367.jpeg"},{"id":"4368","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4368","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_7d92bec320ea1a8600631f1582a96f32.jpeg","title_zh":"全家就弒你家","title_en":"AnyMart","director_zh":"岩崎裕介","director_en":"IWASAKI Yusuke","director_bio":"1993年生於日本，廣告導演出身，曾獲日本規模最大的廣告獎ACC創意影片類大獎。2024年自編自導短片《Void》入選鹿特丹影展等多個國際影展，2026年首部劇情長片《全家就弒你家》入選柏林影展論壇單元，並獲影評人費比西獎。","country":"日本","year":"2026","duration":"89 分","rating":"15+","special_note":"2026柏林影展論壇單元影評人費比西獎","synopsis":"冷冽白光籠罩陳列整齊的商品，店員在上班前齊聲精神喊話，如同冷藏櫃裡的真空包雞肉，依照口味一字排開，卻毫無生氣。不管是熱情的餐館老闆還是找麻煩的奧客，副店長酒井永遠板著一張臉漠然應對；反正只要遵循店內的規矩，飯碗就能穩穩地捧著。然而，隨著新員工加入，店內開始怪事頻傳，單調乏味的世界逐漸瓦解，讓酒井不禁開始動搖──這是他想要的生活嗎？\n\n將父親經營便利商店的心酸血淚轉化為創作靈感，新銳導演岩崎裕介表面寫實批判，卻逐步增添離奇荒誕的恐怖喜劇元素，反而令勞動行為的機械化更顯諷刺，也凸顯出當代青年對工作的恐懼與深層的無力感。實力派演員染谷將太與唐田英里佳的化學反應「怪」出新高度，再加上老戲骨西村雅彥令人發寒的眼神加持，助本片不僅深受影迷好評，還一舉拿下柏林影展論壇單元影評人費比西獎。\n\n歡迎光臨全能便利商店，全能不是你家，就算出事也Always Open。","screenings":[{"date":"2026-04-15","weekday":"三","time":"19:10","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4368_20260415_1910","venueId":"titan","endTime":"20:39"},{"date":"2026-04-17","weekday":"五","time":"14:40","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4368_20260417_1440","venueId":"titan","endTime":"16:09"}],"categories":["東瀛狂想"],"poster_local":"posters/4368.jpeg"},{"id":"4369","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4369","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_5e4cddba6184b8036ff76ac218df6db6.jpeg","title_zh":"愛．死．療養院","title_en":"Honey Bunch","director_zh":"瑪德琳西姆斯費爾","director_en":"Madeleine SIMS-FEWER","director_bio":"加拿大出生，後移居英國，曾於倫敦戲劇中心學習表演，身兼導演、編劇、製片、演員。2015年入選多倫多電影創作者實驗室，2017年開始與達斯提曼奇內利合作，共同編導之首部長片《Violation》於2020年多倫多影展首映。《愛．死．療養院》為兩人最新作品，並入選柏林影展。","country":"加拿大","year":"2025","duration":"114 分","rating":"15+","special_note":"2025西班牙錫切斯奇幻影展最佳視覺效果2025布魯塞爾奇幻影展銀鴉獎2025瑞士紐沙特奇幻影展國際影評人獎2025柏林影展2025多倫多影展2025塔琳黑夜影展2025波蘭Splat!恐怖影展2025倫敦影展2025溫哥華影展","synopsis":"在丈夫的陪伴下，黛安娜來到一座藏在深林中的莊園，這裡是以特殊療法聞名的院所，據說能修補失智及腦傷者的記憶。日光灑進長廊，空氣卻冰冷異常；入住之後，總覺得窗後有人注視，夜裡傳來不屬於這座宅邸的聲響。隨著治療強度提升，她偶然瞥見的意象，是記憶還是幻想？治療的目的，是修復還是破壞？而這背後究竟是不悔的愛，還是不可告人的黑暗？\n\n加拿大情侶檔編導瑪德琳西姆斯費爾、達斯提曼奇內利，找來另一對情侶檔影人葛莉絲格洛維奇、班佩特里主演。全片揉合哥德式恐怖氛圍，以復古質地重探心理驚悚類型。爛番茄網站盛讚它是一部構思巧妙的恐怖片，不僅營造了令人不安的驚悚氛圍，還引人深思關於感情的忠誠，直到最後一刻都充滿了扣人心弦的懸念。於柏林影展首映後，在各大奇幻影展獲獎連連。\n\n只要相信這個療程，妳就會好起來。","screenings":[{"date":"2026-04-13","weekday":"一","time":"20:50","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4369_20260413_2050","venueId":"xinyi12","endTime":"22:44"},{"date":"2026-04-16","weekday":"四","time":"14:00","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4369_20260416_1400","venueId":"xinyi12","endTime":"15:54"},{"date":"2026-04-19","weekday":"日","time":"12:50","venue":"台北信義威秀 13廳","director_attend":false,"no_en_subtitle":false,"id":"s4369_20260419_1250","venueId":"xinyi13","endTime":"14:44"}],"categories":["非一般愛情"],"poster_local":"posters/4369.jpeg"},{"id":"4370","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4370","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_4e0fa34e600d9a0f2433ecf65705f70b.jpeg","title_zh":"愛你致死不渝","title_en":"Obsession","director_zh":"柯瑞巴克","director_en":"Curry BARKER","director_bio":"美國導演、編劇、演員，與庫珀湯姆林森共同創立Youtube喜劇頻道「that's a bad idea」。擅於將喜劇及恐怖元素結合，自編自導自演多部短片，並在網路上獲得熱烈迴響。2025年執導長片《愛你致死不渝》於多倫多影展首映，並於西班牙錫切斯奇幻影展榮獲評審團特別獎等三項大獎。","country":"美國","year":"2025","duration":"109 分","rating":"18+","special_note":"2025西班牙錫切斯奇幻影展評審團特別獎、青少年評審團獎最佳劇情長片、觀眾票選獎2026 SXSW影展2026克里夫蘭影展2025多倫多影展2025奧斯汀奇幻影展","synopsis":"普男貝爾渴望談戀愛，他暗戀同事妮琪，但進度只停在友達以上戀人未滿。心有不甘的他，意外發現能實現願望的神祕小物，衝動許願，沒想到竟然成真！妮琪愛他愛到無法擋，把貝爾當作世界的中心，你就是我的唯一。當愛意與佔有慾成正比，兩人世界扭曲變形，連貝爾都不禁開始害怕，但已經許下的願望，想退回去談何容易？\n\n以YouTube短片起家的新銳導演柯瑞巴克轉戰大銀幕，自編自導首部長片即技驚四座拿下錫切斯奇幻影展三項大獎。借用醒世寓言「如果願望能實現，你願意付出多大代價？」開局，撒上獨特荒謬笑料，壓迫鏡頭與詭異音效層層疊加，演員痴狂演繹理想伴侶與恐怖情人的一線之隔，翻轉恐怖類型公式嚇出新高度。是一部徹底粉碎男性對愛情的美好幻想、直搗內心恐懼的震撼之作！\n\n愛你愛到死～要死一起死～","screenings":[{"date":"2026-04-16","weekday":"四","time":"19:00","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4370_20260416_1900","venueId":"titan","endTime":"20:49"},{"date":"2026-04-17","weekday":"五","time":"16:40","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4370_20260417_1640","venueId":"titan","endTime":"18:29"},{"date":"2026-04-18","weekday":"六","time":"12:20","venue":"MUVIE TITAN","director_attend":false,"no_en_subtitle":false,"id":"s4370_20260418_1220","venueId":"titan","endTime":"14:09"}],"categories":["午夜嚇到笑"],"poster_local":"posters/4370.jpeg"},{"id":"4371","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4371","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_09d431507bb1a2d2c8db40d2d470c3b8.jpeg","title_zh":"忌妒的藍圖","title_en":"The Story of My Wife","director_zh":"伊爾蒂蔻恩伊達","director_en":"Ildikó ENYEDI","director_bio":"1955年生於布達佩斯。匈牙利導演、編劇與製片，以超現實風格著稱，早期從事當代藝術活動。1989年首部劇情長片《我的二十世紀》獲坎城影展金攝影機獎，1999年以《Simon, the Magician》於盧卡諾影展獲獎，2017年《夢鹿情謎》獲柏林影展金熊獎最佳影片、影評人費比西獎，2025年《你是不會當樹嗎》入選威尼斯影展正式競賽，並獲影評人費比西獎。","country":"匈牙利、德國、義大利、法國","year":"2021","duration":"169 分","rating":"15+","special_note":"2022 匈牙利電影獎最佳影片提名2021坎城影展正式競賽2021多倫多影展","synopsis":"1920年，能幹果決的單身船長，長年海上生活導致患了胃部不適的「水手病」。他聽說成婚或可緩解，便立下荒唐賭約：要娶走進這間巴黎咖啡廳的第一個女人；而嫵媚迷人的陌生女子莉茲，竟也一口答應。務實理智的荷蘭船長，就此深陷法國女子的談笑風生。然而她的難以捉摸，又令他墜入嫉妒淵藪，逐步將其吞噬。\n\n東歐最迷人的作者導演之一，伊爾蒂蔻恩伊達向來以強烈鮮明的作者風格著稱。她在《夢鹿情謎》追索愛的形而上連結，這次改編米蘭福斯特四○年代同名小說，則將鏡頭轉向愛情的陰暗面。神祕、不可知的女性母題，在這裡變成婚姻關係中的懷疑與猜忌。精準的場面調度讓影像宛如油畫，用景致將幽微的情緒緊緊纏繞。蕾雅瑟杜狡黠難測的表演，與吉斯納伯逐步崩解的張力彼此拮抗，也把觀眾一同捲入愛慾的暗流深處。\n\n原為方向精準的舵手，終在她魔魅般的愛情裡迷航。","screenings":[{"date":"2026-04-12","weekday":"日","time":"15:30","venue":"台北信義威秀 13＋15廳","director_attend":false,"no_en_subtitle":true,"id":"s4371_20260412_1530","venueId":"xinyi1315","endTime":"18:19"}],"categories":["聚焦：伊爾蒂蔻恩伊達"],"poster_local":"posters/4371.jpeg"},{"id":"4372","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4372","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_ca46980ce809fd6f32200ea1bd939a17.jpeg","title_zh":"血色月森林","title_en":"Gaua","director_zh":"保羅烏爾基霍阿里霍","director_en":"Paul Urkijo ALIJO","director_bio":"1984年生於西班牙，導演、編劇。擅長奇幻、恐怖、民俗傳說等影像敘事。2017年編導首部作品《地獄鐵匠》、2022年《Irati》分別獲聖塞巴斯汀、西班牙錫切斯奇幻影展觀眾票選最佳劇情片，後者至今仍是票房最高的巴斯克語電影。《血色月森林》為其最新作品，獲哥雅獎三項獎項提名。","country":"西班牙、美國","year":"2025","duration":"92 分","rating":"18+","special_note":"2026西班牙哥雅獎最佳特效、化妝、造型設計提名2026鹿特丹影展2025西班牙錫切斯奇幻影展","synopsis":"在西班牙宗教裁判所大舉獵巫的年代、十七世紀的巴斯克山區裡，女子深夜逃離農舍，擺脫家暴丈夫。夜黑風高，鬼影幢幢，沒多久便迷失於幽暗深邃的森林之中。她感覺到一股不祥的存在節節逼近。此時出現三名農婦，她們說是出門洗衣，卻在說長道短中，逼現出女子的祕密。鄉野傳奇、志怪鬼話，原來跟現實也只有一線之隔。\n\n導演保羅烏基霍阿里霍擅長將巴斯克民間傳說賦予新意，探討傳統女性在情慾禁忌、古老信仰和社會壓力之間的掙扎，並試圖重新賦權陰性力量，打造出一則奇幻恐怖卻又有史詩氛圍的黑夜奇譚。突出的美學風格、如卷軸般展開的敘事技巧，堪比西班牙的羅伯艾格斯；巴斯克神話的角色造型設計，也令人想起《羊男的迷宮》。奔放狂亂的結局，足以令保守派為之氣結，卻也大快人心。\n\n荒誕不經、離奇古怪的巴斯克民間恐怖童話，宛如一鍋濃稠的巫婆湯。","screenings":[{"date":"2026-04-16","weekday":"四","time":"16:30","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4372_20260416_1630","venueId":"xinyi12","endTime":"18:02"},{"date":"2026-04-18","weekday":"六","time":"15:00","venue":"台北信義威秀 13廳","director_attend":false,"no_en_subtitle":false,"id":"s4372_20260418_1500","venueId":"xinyi13","endTime":"16:32"},{"date":"2026-04-19","weekday":"日","time":"10:40","venue":"台北信義威秀 13廳","director_attend":false,"no_en_subtitle":false,"id":"s4372_20260419_1040","venueId":"xinyi13","endTime":"12:12"}],"categories":["非一般愛情"],"poster_local":"posters/4372.jpeg"},{"id":"4373","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4373","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_8530af923362a9e90d1074e323ae34a0.jpeg","title_zh":"活死人變裝夜","title_en":"Queens of the Dead","director_zh":"蒂納羅梅洛","director_en":"Tina ROMERO","director_bio":"現居紐約，身兼導演、製片、編劇、演員。就讀紐約大學Tisch藝術學院期間，憑藉卓越表現榮獲「華納兄弟電影獎」。現任「喬治羅梅洛基金會」（GARF）副主席，致力於守護並發揚其父親的藝術遺產。《活死人變裝夜》為其執導之首部劇情長片。","country":"美國","year":"2026","duration":"101 分","rating":"15+","special_note":"2025美國哈特蘭影展觀眾票選獎2025翠貝卡影展觀眾票選獎2025西班牙錫切斯奇幻影展2025加拿大奇幻影展","synopsis":"布魯克林的倉庫酒吧，變裝皇后以妖豔之姿準備征服舞台，卻遇到一連串狗屁倒灶突來攪局：馬桶不通、票房告急，連紅牌都No Show。眼看就要開天窗，代打還在怯場；戴好羽毛、亮片、假睫毛，節奏照樣催落去！連有品味的活屍姐妹也不請自來，主秀還沒登場，生存戰役先開打。如果這是末日，就把街頭變成我們的After Party！\n\n導演蒂納羅梅洛身為「活屍片之父」喬治羅梅洛的掌上明珠，從小浸淫在《活死人之夜》等另類影史經典的世界。首部長片不僅繼承父志，更發揚光大，把變裝皇后融合活屍元素。除了玩轉經典，反諷惡趣味；也理直氣壯讓酷兒現身，相愛相殺，鬥狠不忘鬥嘴，即使人生下台也要華麗退場，開創出新世代活屍電影的華麗新風貌。難怪洛杉磯時報也盛讚：任何喜歡恐怖片的人都能在此找到樂趣。\n\n死了都要High，不Crazy All Night不痛快！","screenings":[{"date":"2026-04-10","weekday":"五","time":"19:00","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4373_20260410_1900","venueId":"xinyi12","endTime":"20:41"},{"date":"2026-04-13","weekday":"一","time":"16:30","venue":"台北信義威秀 12廳","director_attend":false,"no_en_subtitle":false,"id":"s4373_20260413_1630","venueId":"xinyi12","endTime":"18:11"},{"date":"2026-04-18","weekday":"六","time":"10:50","venue":"台北信義威秀 13廳","director_attend":false,"no_en_subtitle":false,"id":"s4373_20260418_1050","venueId":"xinyi13","endTime":"12:31"}],"categories":["午夜嚇到笑"],"poster_local":"posters/4373.jpeg"},{"id":"4374","url":"https://www.goldenhorse.org.tw/film/programme/films/detail/4374","poster_url":"https://storage.googleapis.com/tghff_outland/image/photo/2026/GHFF/huge/photo_a8898ffafe48a06bdf8b576c0c39a9c9.jpeg","title_zh":"夢鹿情謎","title_en":"On Body and Soul","director_zh":"伊爾蒂蔻恩伊達","director_en":"Ildikó ENYEDI","director_bio":"1955年生於布達佩斯。匈牙利導演、編劇與製片，以超現實風格著稱，早期從事當代藝術活動。1989年首部劇情長片《我的二十世紀》獲坎城影展金攝影機獎，1999年以《Simon, the Magician》於盧卡諾影展獲獎，2017年《夢鹿情謎》獲柏林影展金熊獎最佳影片、影評人費比西獎，2025年《你是不會當樹嗎》入選威尼斯影展正式競賽，並獲影評人費比西獎。","country":"匈牙利","year":"2017","duration":"116 分","rating":"18+","special_note":"2018奧斯卡最佳外語片匈牙利代表2017柏林影展金熊獎、影評人費比西、人道精神獎2017歐洲電影獎最佳女演員2017雪梨影展最佳影片2017多倫多影展","synopsis":"沉默寡言、左手殘疾的安德烈在屠宰場擔任財管，過著單調的生活。他深受新進的品管人員瑪莉亞吸引，卻不知如何表達。有社交障礙的瑪莉亞純真美麗，但凡事一絲不苟沒有彈性，讓同事們感到難以親近。孤獨的兩人無法產生交集，直到一次意外事件，他們發現彼此每晚作著同樣一個夢，化身為雄鹿與雌鹿在冬日的森林裡相戀、漫步。當他們嘗試將美好的夢境轉移到現實生活，肉體和言語卻成了阻礙他們的難關。\n\n匈牙利導演伊爾蒂蔻恩伊達，承襲了東歐電影的神祕氣息，以「異床同夢」的奇幻設定，在簡潔影像、詩意風格中，譜寫出一段介乎現實人生與童 function renderCatChips(){
  const cats = ["全部", ...Object.keys(CAT_COLORS)];
  const el = document.getElementById("cat-chips");
  el.innerHTML = cats.map(c=>{
    const active = c===currentFilterCat?" active":"";
    const col = c==="全部" ? "var(--accent)" : CAT_COLORS[c]||"#888";
    const style = c===currentFilterCat ? `background:${col};` : "";
    return `<button class="cat-chip${active}" style="${style}" onclick="filterCat('${esc(c)}')">${esc(c)}</button>`;
  }).join("");
}

  if (vals.includes("want")) return "want";
  return null;
}

    const pref = getMyPrefsForFilm(film);

// ── Film detail modal ──
// 檢查特定場次是否與目前已選的場次衝堂
function checkConflicts(sid) {
  if (!currentName) return [];
  const myPrefs = allPrefs[currentName] || {};
  const targetS = screeningMap[sid].screening;
  const targetStart = timeToMin(targetS.time);
  const targetEnd = timeToMin(targetS.endTime);

  const conflicts = [];
  for (const [otherSid, pref] of Object.entries(myPrefs)) {
    if (!pref || otherSid === sid) continue; // 略過未選或自己

    const otherS = screeningMap[otherSid].screening;
    const otherFilm = screeningMap[otherSid].film;
    
    // 如果是同一天，就檢查時間是否重疊
    if (otherS.date === targetS.date) {
      const otherStart = timeToMin(otherS.time);
      const otherEnd = timeToMin(otherS.endTime);
      // 邏輯：A的開始早於B的結束，且A的結束晚於B的開始，即算重疊
      if (targetStart < otherEnd && otherStart < targetEnd) {
        conflicts.push(`《${otherFilm.title_zh}》(${otherS.time})`);
      }
    }
  }
  return conflicts;
}

// 更新彈跳視窗內的衝堂提示
window.updateModalConflicts = () => {
  const conflictDivs = document.querySelectorAll('[id^="conflict-"]');
  conflictDivs.forEach(div => {
    const sid = div.id.replace('conflict-', '');
    const conflicts = checkConflicts(sid);
    const myPrefs = allPrefs[currentName] || {};
    const isSelected = !!myPrefs[sid];

    if (conflicts.length > 0) {
       div.innerHTML = `⚠️ 衝堂提示：與已選的 ${conflicts.join('、')} 時間重疊`;
       div.style.display = 'block';
       // 已點選時顯示紅色，尚未點選但有衝堂時顯示橘色提醒
       div.style.color = isSelected ? 'var(--must)' : 'var(--want)'; 
    } else {
       div.style.display = 'none';
    }
  });
};

        </div>

};

// ── Toggle pref ──
window.togglePref = async (sid, value) => {
  if (!currentName){ showToast("請先輸入名字"); return; }
  if (!allPrefs[currentName]) allPrefs[currentName]={};
  const prev = allPrefs[currentName][sid];
  const next = prev===value ? null : value;
  if (next===null) delete allPrefs[currentName][sid];
  else allPrefs[currentName][sid]=next;

  const row = document.getElementById(`srow-${sid}`);
  if (row){
    row.className = "screening-row"+(next==="must"?" sel-must":next==="want"?" sel-want":"");
    const [mb,wb]=row.querySelectorAll(".pref-btn");
    if(mb) mb.className=next==="must"?"pref-btn must-active":"pref-btn";
    if(wb) wb.className=next==="want"?"pref-btn want-active":"pref-btn";
  }
  const info = screeningMap[sid];
  const label = next==="must"?"❤️ 必看":next==="want"?"⭐ 想看":"取消";
  showToast(`${label}  ${info?.film.title_zh||""}`);
  await writePref(currentName, sid, next);
  updateModalConflicts(); // 每次點擊後重新計算
};

     // === 整合時程畫面：顯示日期選單與時間軸 ===

     ).join("");

     html += ALL_DATES.map((d,i)=>

// Timeline constants
const TL_SLOT = 1.5;   // px per minute
const TL_COL_W = 120;  // px per venue column
const TL_TIME_W = 44;  // px for time label column
const TL_BASE = 9*60+30; // 09:30

function buildTimelineBase(date){
  // Collect all screenings for this date
  const slots = [];
  FILMS_DATA.forEach(f=>{
    const dur = parseInt((f.duration||"0").replace(/\D/g,""))||90;
    f.screenings.filter(s=>s.date===date).forEach(s=>{
      slots.push({...s, film:f, dur});
    });
  });
  return slots;
}

function tlY(time){ return (timeToMin(time)-TL_BASE)*TL_SLOT; }

function renderTimelineHTML(slots, venueIds, blockFn){
  if(!slots.length) return `<div class="schedule-empty">這天沒有場次</div>`;

  const allTimes = slots.flatMap(s=>[timeToMin(s.time), timeToMin(s.endTime)]);
  const minT = Math.max(TL_BASE, Math.min(...allTimes)-15);
  const maxT = Math.max(...allTimes)+20;
  const totalH = (maxT-minT)*TL_SLOT;

  const N = venueIds.length; // 計算今天共有幾欄戲院

  let html = `<div class="tl-scroll"><div class="tl-wrap" style="width:100%">`;
  // Header：改成 width:100% 與 flex:1 均分寬度
  html += `<div class="tl-header-row" style="width:100%">`;
  html += `<div class="tl-time-th" style="width:44px; flex-shrink:0;"></div>`;
  venueIds.forEach(vid=>{
    const v=VENUE_MAP[vid]; if(!v) return;
    html+=`<div class="tl-col-header" style="background:${v.color}; flex: 1; border-left:1px solid rgba(255,255,255,.1);">${esc(v.name)}</div>`;
  });
  html += `</div>`;
  // Body：改成 width:100%
  html += `<div class="tl-body" style="height:${totalH}px; width:100%;">`;
  // Grid lines
  for(let t=Math.ceil(minT/30)*30; t<=maxT; t+=30){
    const y=(t-minT)*TL_SLOT;
    const cls=t%60===0?"tl-gridline hour":"tl-gridline";
    html+=`<div class="${cls}" style="top:${y}px"></div>`;
    if(t%60===0){
      html+=`<div class="tl-time-label" style="top:${y}px">${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}</div>`;
    }
  }
  // Blocks per venue：把第幾欄(ci)與總欄數(N)傳給區塊函數
  venueIds.forEach((vid,ci)=>{
    const vSlots = slots.filter(s=>s.venueId===vid);
    vSlots.forEach(s=>{
      const y=(timeToMin(s.time)-minT)*TL_SLOT;
      const h=(timeToMin(s.endTime)-timeToMin(s.time))*TL_SLOT;
      html += blockFn(s, ci, N, y, h, vid);
    });
  });
  html += `</div></div></div>`;
  return html;
}

function renderIntegratedDay(date, idx){
  const slots = buildTimelineBase(date);
  const venueIds = VENUES.map(v=>v.id).filter(vid=>slots.some(s=>s.venueId===vid));

  const blockFn = (s, ci, N, y, h, vid) => {
    const v=VENUE_MAP[vid];
    const col=v?.color||"#888";
    // Collect who wants/must this screening
    const musts=[], wants=[];
    Object.entries(allPrefs).forEach(([name,prefs])=>{
      if(prefs[s.id]==="must") musts.push(name);
      else if(prefs[s.id]==="want") wants.push(name);
    });
    if(!musts.length&&!wants.length) return "";
    const persons=[...musts,...wants];
    const dotsCls = musts.length?"tl-must":"tl-want";
    const dotsHtml=persons.map(n=>`<span class="tl-person-dot ${musts.includes(n)?'must':'want'}">${esc(n[0])}</span>`).join("");
    
    // 關鍵：用 CSS calc() 計算出區塊的 X 座標跟寬度
    const leftCalc = `calc(44px + (100% - 44px) / ${N} * ${ci} + 2px)`;
    const widthCalc = `calc((100% - 44px) / ${N} - 4px)`;

    return `<div class="tl-block ${dotsCls}" style="left:${leftCalc};top:${y}px;width:${widthCalc};height:${Math.max(h,18)}px;background:${col};" onclick="openFilmModal('${s.film.id}')">
      <div class="tl-block-inner">
        <div class="tl-block-name">${esc(s.film.title_zh)}</div>
        <div class="tl-block-persons">${dotsHtml}</div>
      </div>
    </div>`;
  };

  document.getElementById(`sched-integrated-${idx}`).innerHTML = 
    slots.length ? renderTimelineHTML(slots.filter(s=>Object.values(allPrefs).some(p=>p[s.id])), venueIds, blockFn)
    : `<div class="schedule-empty">這天沒有場次</div>`;
}

function renderAllPersonalSchedule(name) {
  const el = document.getElementById('personal-all-days');
  const myPrefs = allPrefs[name]||{};
  const allSlots = [];
  FILMS_DATA.forEach(f => f.screenings.forEach(s => allSlots.push({...s, film: f})));
  
  const myAllSlots = allSlots.filter(s => myPrefs[s.id]);
  if (myAllSlots.length === 0) {
     el.innerHTML = `<div class="schedule-empty">${esc(name)} 還沒選片</div>`;
     return;
  }

  const filmCounts = {};
  myAllSlots.forEach(s => { filmCounts[s.film.id] = (filmCounts[s.film.id] || 0) + 1; });

  let html = "";
  
  // 依序跑過每一天
  ALL_DATES.forEach(dateObj => {
     const mySlots = myAllSlots.filter(s => s.date === dateObj.date);
     if (mySlots.length === 0) return; // 這天沒選片就跳過

     // 加上明顯的日期分隔標題
     html += `<div style="font-size:16px; font-weight:700; color:var(--accent); margin: 24px 0 10px 0; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:6px;">📅 ${esc(dateObj.label)}</div>`;

     mySlots.sort((a, b) => timeToMin(a.time) - timeToMin(b.time));

     // 衝堂分群邏輯
     const groups = [];
     mySlots.forEach(s => {
         if (groups.length === 0) {
             groups.push([s]);
         } else {
             const lastGroup = groups[groups.length - 1];
             const maxEndTime = Math.max(...lastGroup.map(gs => timeToMin(gs.endTime)));
             if (timeToMin(s.time) < maxEndTime) {
                 lastGroup.push(s);
             } else {
                 groups.push([s]);
             }
         }
     });

     // 渲染卡片
     groups.forEach(group => {
         const isConflict = group.length > 1;
         const borderCol = isConflict ? "var(--must)" : "var(--border)";
         const conflictNotice = isConflict ? `<div style="color:var(--must); font-size:12px; font-weight:700; margin-bottom:8px;">⚠️ 衝堂警告：同時段有 ${group.length} 部電影</div>` : "";
         
         html += `<div style="background:var(--surface2); border: 1px solid ${borderCol}; border-radius:12px; padding:12px; margin-bottom:12px;">`;
         html += conflictNotice;
         html += `<div style="display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;">`;
         
         group.forEach(s => {
             const pref = myPrefs[s.id];
             const v = VENUE_MAP[s.venueId];
             const vColor = v?.color || "#888";
             const isDuplicate = filmCounts[s.film.id] > 1;
             const dupWarning = isDuplicate ? `<div style="color:#F59E0B; font-size:11px; font-weight:700; margin-top:6px;">⚠️ 跨場次重複選取</div>` : "";
             
             html += `
             <div style="flex: 1; min-width: 140px; background:var(--surface); border-radius:8px; padding:10px; border-left: 4px solid ${vColor}; cursor:pointer;" onclick="openFilmModal('${s.film.id}')">
                 <div style="font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; line-height:1.3;">${esc(s.film.title_zh)}</div>
                 <div style="font-size:12px; color:var(--text2); font-weight:600;">${s.time} - ${s.endTime}</div>
                 <div style="font-size:11px; color:${vColor}; margin-top:2px;">${esc(v?.name || s.venue)}</div>
                 <div class="tl-badge ${pref}" style="margin-top:6px;">${pref==="must"?"必看":"想看"}</div>
                 ${dupWarning}
             </div>`;
         });
         
         html += `</div></div>`;
     });
  });

  el.innerHTML = html;
}
